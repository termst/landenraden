:root{
  --paper:#f2ede2;--card:#fbf8f1;--card2:#efe9db;--line:#d8cfbb;--ink:#1b2428;--mute:#6a7276;
  --acc:#c2432b;--acc-d:#a43520;--sea:#1f5868;--gold:#b9801a;--bad:#b3261e;--ok:#2d7a4d;--r:12px;
  --display:'The Bold Font',Impact,'Arial Black',sans-serif;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --field:#fff;--flash:#fff5d6;--done:#e5f1e8;--ink2:#3a454a;
  --shadow:0 4px 14px -6px rgba(27,36,40,.3);
}
[data-theme=dark]{
  color-scheme:dark;
  --paper:#14181a;--card:#1d2326;--card2:#262d30;--line:#37414a;--ink:#ece6d8;--mute:#919ba0;
  --acc:#e0583d;--acc-d:#c24a31;--sea:#5fb0c4;--gold:#d9a441;--bad:#ef6b61;--ok:#5cb97f;
  --field:#262d30;--flash:#4a3f1c;--done:#1f3a2a;--ink2:#cfc9bb;
  --shadow:0 4px 14px -6px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-synthesis:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
/* Displayfont: alleen kapitalen en één gewicht */
h1,h2,label,.eyebrow,.btn,.pill,.seg button,.chipbtn,.mini,.badge,.code,.chip,.hint .k,.hint .v,.next,.nm-big,.locked,.toast,th,td.n,.pod,.stat small,.stat b,.stat i,.avatar,#codeIn,.cempty{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:clamp(42px,13vw,64px);line-height:1;margin:10px 0 6px}
h1 em{font-style:normal;color:var(--acc)}
h2{font-size:20px;margin:0}
.sub{color:var(--mute);margin:0;line-height:1.4;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.eyebrow,label{font-size:13px;color:var(--mute)}
input[type=text]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--sea)}
.btn{border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:17px;cursor:pointer;background:var(--card);transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d);border-color:var(--acc-d)}
.btn.sec{background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .row{flex:none;gap:8px}
.pill{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer;user-select:none;transition:border-color .15s}
.pill:hover{border-color:var(--ink)}
.iconbtn{width:34px;height:34px;display:inline-grid;place-items:center;padding:0;background:var(--card);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:border-color .15s}
.iconbtn:hover{border-color:var(--ink)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;color:#fff;transition:background .2s,transform .2s}
.avatar.bump{transform:scale(1.12)}
.nameRow{display:flex;gap:12px;align-items:center}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:none;transition:transform .15s}
.colors button:hover{transform:scale(1.1)}
.colors button.on{box-shadow:0 0 0 2.5px var(--ink)}
#codeIn{letter-spacing:.2em;text-align:center}
#joinBtn{flex:none;min-width:100px}
/* lobby */
.code{font-size:52px;letter-spacing:.14em;padding-left:.14em;text-align:center;line-height:1.1}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:9px 12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pl .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--paper)}
.badge.off{background:var(--line);color:var(--mute)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:20px;padding:0 4px;line-height:1}
.x:hover{color:var(--bad)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,36,40,.18)}
.seg.ro button{pointer-events:none}
.seg.sm button{font-size:12.5px;padding:8px 1px}
.field{display:flex;flex-direction:column;gap:7px}
.err{color:var(--bad);font-size:14px;margin:0}
.err:empty{display:none}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle .seg{width:120px}
.toggle .seg button{display:grid;place-items:center;padding:7px 4px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--sea)}.sw.on::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 13px;font-size:14px;cursor:pointer;color:var(--mute);transition:all .15s}
.chipbtn:hover{border-color:var(--ink);color:var(--ink)}
.chipbtn.on{background:var(--sea);border-color:var(--sea);color:#fff}
.chips.ro .chipbtn{pointer-events:none}
details.card>summary{font-family:var(--display);text-transform:uppercase;font-size:20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'+';color:var(--mute)}
details.card[open]>summary::after{content:'\2212'}
/* game */
#game{padding:0}
#map,#pano{position:absolute;inset:0;background:#1c2b30}
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;z-index:500;pointer-events:none;align-items:stretch}
.hud>*{pointer-events:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;box-shadow:var(--shadow)}
.chip small{font-size:11px;color:var(--mute)}
.chip b{font-weight:400;font-size:19px}
.chip.timer{min-width:84px;align-items:center;position:relative;overflow:hidden}
#timerChip{display:flex;justify-content:center}
#timerChip i{font-style:normal;width:.72em;text-align:center}
#timerChip i:nth-child(2){width:.3em}
.chip.timer.low b{color:var(--bad);animation:throb 1s infinite}
@keyframes throb{50%{opacity:.45}}
.tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--sea);width:100%;transform-origin:left;transition:transform .2s linear,background .3s}
.chip.timer.low .tbar{background:var(--bad)}
.grow{flex:1}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin:auto}
.netdot.mid{background:var(--gold)}.netdot.bad{background:var(--bad)}
.mapctl{position:absolute;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 62px);z-index:500;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:20px;cursor:pointer;line-height:1;transition:background .15s,transform .1s}
.mapctl button:hover{background:var(--field)}.mapctl button:active{transform:scale(.92)}
.mapctl.off{display:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:500;padding:10px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:580px;margin:0 auto;pointer-events:none}
.panel>*{pointer-events:auto}
.credit{align-self:flex-end;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.hints{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.hhead{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;cursor:pointer;user-select:none}
.hhead .eyebrow{flex:1}
.hhead .eyebrow b{color:var(--ink);font-weight:400;margin-left:6px}
.mini{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;transition:background .15s,color .15s,opacity .15s}
.mini:hover{background:var(--ink);color:var(--paper)}
.mini.voted{background:var(--sea);border-color:var(--sea);color:#fff;pointer-events:none}
.chev{width:26px;text-align:center;color:var(--mute);transition:transform .2s;font-size:13px}
.hints.shut .chev{transform:rotate(180deg)}
.hints.shut #hintList,.hints.shut .next{display:none}
#hintList{max-height:30vh;overflow-y:auto;border-top:1px solid var(--line)}
.hint{display:flex;gap:12px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line);animation:slide .3s ease}
.hint:last-child{border-bottom:0}
.hint.new{background:var(--flash);animation:slide .3s ease,flash 2.2s ease forwards}
@keyframes flash{to{background:transparent}}
.hint .k{color:var(--mute);font-size:13px;flex:none;min-width:92px}
.hint .v{font-size:17px;line-height:1.25}
.hint .v img{height:34px;border-radius:3px;box-shadow:0 0 0 1px var(--line);vertical-align:middle}
.next{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line);background:var(--card2)}
.next b{font-weight:400;color:var(--ink);min-width:28px;text-align:right}
.bar{height:4px;background:var(--line);border-radius:4px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.answer{position:relative;display:flex;gap:8px}
.answer input{box-shadow:var(--shadow);border-color:var(--ink)}
.answer .btn{flex:none}
.ac{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--card);border:1px solid var(--ink);border-radius:10px;overflow:hidden;display:none;box-shadow:var(--shadow)}
.ac.on{display:block}
.ac div{padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.ac div img{width:24px;height:18px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.ac div.sel,.ac div:hover{background:var(--card2)}
.ac mark{background:none;font-weight:700;color:var(--acc)}
.locked{background:var(--ink);color:var(--paper);border-radius:10px;padding:13px 14px;font-size:17px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:pop .2s ease}
.locked b{font-weight:400}
.locked img{height:18px;border-radius:2px}
.locked span{margin-left:auto;font-size:13px;opacity:.65}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);transition:all .2s}
.who span.done{border-color:var(--ok);background:var(--done)}
.who span.off{opacity:.45}
/* result */
#rmap{height:36vh;min-height:220px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);flex:none}
.answerbig{display:flex;align-items:center;gap:14px}
.answerbig img{height:44px;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.nm-big{font-size:32px;line-height:1.05}
#resSub{font-family:var(--display);text-transform:uppercase;font-size:13px;margin-top:3px}
#resCredit{font-size:11.5px;margin:-4px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mute);text-align:left;padding:6px 4px;font-size:12px}
th.n{text-align:right}
td{padding:10px 4px;border-top:1px solid var(--line)}
td.n{text-align:right;font-size:15px}
td img{height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
tbody tr{animation:slide .3s ease backwards}
.good{color:var(--ok)}.half{color:var(--gold)}.miss{color:var(--bad)}
/* final */
.podium{display:flex;align-items:flex-end;gap:10px;height:210px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:30px;color:#fff;transform-origin:bottom;animation:grow .5s ease backwards}
@keyframes grow{from{transform:scaleY(0)}}
.pod .pn{font-size:15px;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.pod .ps{font-size:14px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat small{color:var(--mute);font-size:12px}
.stat b{font-weight:400;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat i{font-style:normal;font-size:13px;color:var(--mute)}
/* overlay */
.ov{position:fixed;inset:0;z-index:2000;background:rgba(27,36,40,.55);display:none;align-items:center;justify-content:center;padding:24px}
.ov.on{display:flex;animation:fade .15s}
.ov .card{max-width:420px;width:100%;text-align:center;align-items:center;box-shadow:var(--shadow)}
#ovText{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:18px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal .card{text-align:left;align-items:stretch;max-height:85vh;overflow-y:auto}
.modal li{color:var(--ink2);line-height:1.45}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(calc(-100% - 40px));z-index:3000;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;transition:transform .3s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.on{transform:translateX(-50%) translateY(0)}
.leaflet-container{font-family:var(--font);background:#1c2b30}
.leaflet-control-attribution{font-size:9px!important;background:var(--card)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--mute)!important}
#chatBtn{position:fixed;left:12px;bottom:12px;z-index:1500;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:none;place-items:center;cursor:pointer;padding:0}
#chatBtn.show{display:grid}
body[data-screen=game] #chatBtn{top:66px;bottom:auto;left:10px}
#chatBadge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
#chatBadge.on{display:grid}
#chat{position:fixed;left:12px;bottom:12px;z-index:1600;width:min(340px,calc(100vw - 24px));height:min(420px,60vh);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#chat.on{display:flex;animation:slide .2s ease}
body[data-screen=game] #chat{top:66px;bottom:auto;left:10px}
.chead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;align-self:flex-start;display:flex;flex-direction:column;gap:2px}
.msg small{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--mute)}
.msg p{margin:0;background:var(--card2);padding:7px 11px;border-radius:12px 12px 12px 3px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me p{background:var(--sea);color:#fff;border-radius:12px 12px 3px 12px}
.cempty{margin:auto;color:var(--mute);font-size:14px}
#chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chatForm .btn{padding:0 14px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ================= DATA ================= */
let COUNTRIES = {}, GEO = {}, SEARCH = [];
async function loadData(){
  overlay(t('loading'));
  const [c, g] = await Promise.all([fetch('data/countries.json').then(r=>r.json()), fetch('data/countries.geojson').then(r=>r.json())]);
  COUNTRIES = c; buildCurrencies();
  for (const f of g.features){
    const polys = f.geometry.coordinates.map(rings => {
      const outer = rings[0]; let minX=180,minY=90,maxX=-180,maxY=-90, a=0;
      for (let i=0;i<outer.length;i++){ const [x,y]=outer[i]; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        const n=outer[(i+1)%outer.length]; a += x*n[1]-n[0]*y; }
      const area = Math.abs(a/2) * Math.cos(((minY+maxY)/2)*Math.PI/180);
      return { rings, bbox:[minX,minY,maxX,maxY], area };
    });
    GEO[f.properties.c] = { feature: f, polys, area: polys.reduce((s,p)=>s+p.area,0) };
  }
  for (const [code, c] of Object.entries(COUNTRIES)){
    if (!GEO[code]) continue;
    const names = new Set([c.nl, c.en, ...c.alias]);
    SEARCH.push({ code, keys: [...names].map(norm).filter(Boolean) });
  }
  overlay(null);
}

/* ================= GEOMETRY ================= */
function inRing(x, y, ring){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
const inPoly = (x,y,p) => inRing(x,y,p.rings[0]) && !p.rings.slice(1).some(h=>inRing(x,y,h));
function countryAt(lat, lng){
  for (const [code, g] of Object.entries(GEO)) for (const p of g.polys){
    const [a,b,c,d]=p.bbox; if (lng>=a&&lng<=c&&lat>=b&&lat<=d && inPoly(lng,lat,p)) return code;
  }
  return null;
}
function pickWeighted(items, w){ let s=items.reduce((a,i)=>a+w(i),0), r=Math.random()*s; for(const i of items){ r-=w(i); if(r<=0) return i; } return items[items.length-1]; }
function countryPool(s, used){
  const fits = c => COUNTRIES[c] && (s.continent==='ALL' || COUNTRIES[c].cont===s.continent);
  const pool = Object.keys(GEO).filter(c => fits(c) && !used.includes(c) && (s.small || !COUNTRIES[c].small));
  return pool.length ? pool : Object.keys(GEO).filter(fits);
}
const pickCountry = (s, pool) => s.weighting==='area' ? pickWeighted(pool, c=>GEO[c].area) : rnd(pool);
function pointIn(code){
  const poly = pickWeighted(GEO[code].polys, p=>p.area), [a,b,c,d] = poly.bbox;
  for (let i=0;i<200;i++){
    const lng = a + Math.random()*(c-a), lat = b + Math.random()*(d-b);
    if (inPoly(lng, lat, poly)) return { code, lat:+lat.toFixed(4), lng:+lng.toFixed(4), poly };
  }
  return null;
}
function randomLocation(s, used){
  let pool = countryPool(s, used);
  while (pool.length){
    const code = pickCountry(s, pool), spot = pointIn(code);
    if (spot) return spot;
    pool = pool.filter(x=>x!==code);
  }
  return null;
}

/* ================= STRAATBEELD ================= */
const inCountry = (code, lng, lat) => GEO[code].polys.some(p => { const [a,b,c,d]=p.bbox; return lng>=a&&lng<=c&&lat>=b&&lat<=d&&inPoly(lng,lat,p); });
const is360 = f => f.properties['pers:interior_orientation']?.field_of_view === 360;
// Host laadt de foto vooraf: een kapotte foto mag geen ronde starten.
function loadPhoto(f){

  return new Promise(res => {
    if (!sd) return res(null);
    const img = new Image(), timer = setTimeout(()=>res(null), CONFIG.street.loadMs);
    img.crossOrigin = 'anonymous';
    img.onerror = () => { clearTimeout(timer); res(null); };
    img.onload = () => { clearTimeout(timer); res({
      sd, pano, hd: pano ? f.assets.hd?.href : null, w: o.sensor_array_dimensions?.[0] || 0,
      fov: o.field_of_view || CONFIG.street.flatFov, ratio: img.naturalHeight / img.naturalWidth,
      by: f.providers?.[0]?.name || '', lic: f.properties.license || '',
    }); };
    img.src = sd;
  });
}
async function photoNear({ code, lat, lng, poly }){
  const [a,b,c,d] = poly.bbox, r = CONFIG.street.radius;
  const boxes = [[Math.max(a,lng-r), Math.max(b,lat-r), Math.min(c,lng+r), Math.min(d,lat+r)], [a,b,c,d]];
  for (const box of boxes){
    const res = await fetch(`${CONFIG.street.api}?bbox=${box.join(',')}&limit=${CONFIG.street.limit}`);
    if (!res.ok) throw new Error('search ' + res.status);
    const hits = ((await res.json()).features || []).filter(f => inCountry(code, ...f.geometry.coordinates));
    const panos = hits.filter(is360);
    if (!hits.length) continue;
    const f = rnd(panos.length ? panos : hits), photo = await loadPhoto(f);
    if (photo){ const [x,y] = f.geometry.coordinates; return { code, lng:+x.toFixed(4), lat:+y.toFixed(4), photo }; }
  }
  return null;
}
async function findPhoto(s, used){
  let pool = countryPool(s, used);
  for (let i=0; i<CONFIG.street.tries && pool.length; i++){
    const code = pickCountry(s, pool), spot = pointIn(code), found = spot && await photoNear(spot);
    if (found) return found;
    pool = pool.filter(x=>x!==code);
  }
  return null;
}

  const on = (groups && groups.length) ? groups : HINT_GROUPS;

  if (!avail.length) avail = HINT_DEFS.filter(h => h.ok(c, code));
  const first = avail.find(h=>h.k==='cont') || avail.slice().sort((a,b)=>a.r-b.r)[0];
  const lates = avail.filter(h=>h.late && h!==first);
  const last = lates.length ? rnd(lates) : avail.filter(h=>h!==first).sort((a,b)=>b.r-a.r)[0];
  const used = new Set([first && first.f, last && last.f]);
  const middle = [];
  for (const h of shuffle(avail.filter(h => h!==first && h!==last && !h.late))){
    if (middle.length >= Math.max(0, count-2)) break;
    if (used.has(h.f)) continue;
    used.add(h.f); middle.push(h);
  }
  middle.sort((a,b)=>a.r-b.r);
  return [...new Set([first, ...middle, last].filter(Boolean))].slice(0, count).map(h=>h.k);
}
// Host: ruwe, taalneutrale waarde. Client: tekst in eigen taal.
function hintValue(k, code, loc){
  const c = COUNTRIES[code];
  const nm = l => { const n = c[l] || c.en; return { l: n[0], n: n.replace(/[^\p{L}]/gu,'').length }; };
  const lat = loc ? loc.lat : 0, lng = loc ? loc.lng : 0;
  switch(k){
    case 'cont': return c.cont; case 'sub': return c.sub; case 'drive': return c.drive;
    case 'coast': return { land: c.land, nb: c.nb.length }; case 'pop': return c.pop;
    case 'lang': return c.lang; case 'tel': return c.tel; case 'tld': return c.tld;
    case 'cur': case 'cursym': return CODES[code];
    case 'curshare': return { n: Math.max(0, (CURCOUNT[CODES[code][0]]||1) - 1) };
    case 'nb': return c.nb; case 'nb1': return rnd(c.nb);
    case 'cap': return c.cap[0]; case 'name': return { nl: nm('nl'), en: nm('en') };
    case 'namelen': return { nl: nm('nl').n, en: nm('en').n };
    case 'flag': return code;
    case 'hemi': return { ns: lat>=0?'N':'S', ew: lng>=0?'E':'W' };
    case 'climate': { const a = Math.abs(lat); return a<23.5?0 : a<35?1 : a<55?2 : a<66?3 : 4; }
    case 'size': { const a = c.area; return a<1e4?0 : a<1e5?1 : a<5e5?2 : a<2e6?3 : 4; }
  }
}
function renderHintValue(k, v){
  switch(k){
    case 'cont': return t(v);
    case 'sub': return lang==='nl' ? (SUB_NL[v]||v) : v;
    case 'drive': return t(v==='L'?'left':'right');
    case 'coast': return (v.land ? t('landlocked') : t('coast')) + ', ' + (v.nb ? t('nbCount',{n:v.nb}) : t('island'));
    case 'pop': return t('pop'+v);
    case 'lang': return v.map(l => lang==='nl' ? (LANG_NL[l]||l) : l).join(', ');
    case 'cursym': return v.map(cc => { const s = curSym(cc); return s===cc ? cc : s; }).join('  ·  ');
    case 'cur': return v.map(cc => { const n = curName(cc); return n === cc ? (cc==='ZWG' ? 'Zimbabwe Gold (ZWG)' : cc) : n + ' (' + cc + ')'; }).join(', ');
    case 'curshare': return v.n ? t('curShared',{n:v.n}) : t('curOnly');
    case 'tel': case 'tld': return v;
    case 'nb': return v.map(cname).join(', ');
    case 'nb1': return t('borders',{c:cname(v)});
    case 'cap': return t('capLetter', { l: v });
    case 'name': { const x = v[lang] || v.en; return t('nameLetter', { l: x.l, n: x.n }); }
    case 'namelen': return t('nameLen', { n: v[lang] || v.en });

}

/* ================= STATE ================= */
const me = {

localStorage.setItem('lr_pid', me.id);

const DEFAULT_SETTINGS = { mode:'map', rounds:5, roundTime:60, hintEvery:10, hintCount:6, hintGroups:[...HINT_GROUPS], difficulty:'normal', continent:'ALL', weighting:'uniform', small:false };
let room = null, roomCode = null, isHost = false, solo = false;

/* ================= NETWORK ================= */
function connect(code){
  roomCode = code;
  room = joinRoom({ appId: CONFIG.appId, turnConfig: CONFIG.turn.length ? CONFIG.turn : undefined }, 'LR-' + code);
  const action = room.makeAction('m');
  sendMsg = (msg, target) => action.send(msg, target ? { target } : undefined).catch(()=>{});
  action.onMessage = (msg, ctx) => onNet(msg, ctx.peerId);
  const chatAct = room.makeAction('c');
  sendChat = msg => chatAct.send(msg).catch(()=>{});
  chatAct.onMessage = m => receiveChat(m);
  room.onPeerJoin = peerId => {
    if (isHost) return; // host wacht op hello
    sendMsg({ t:'hello', p: helloPayload() }, peerId);
  };
  room.onPeerLeave = peerId => onPeerLeave(peerId);

}
const helloPayload = () => ({ id: me.id, name: me.name, color: me.color });
async function disconnect(){

  if (room) { try { await room.leave(); } catch(e){} }
  room = null; sendMsg = null; sendChat = null; chatLog = []; unread = 0; $('#chat').classList.remove('on'); isHost = false; solo = false; S = null; H = null; myAnswer = null; roomCode = null; lastSig = '';
  history.replaceState(null, '', location.pathname + location.search);
}

// Actie van mezelf: host verwerkt lokaal, peer stuurt naar host.
function act(msg){

  else if (S && sendMsg) sendMsg(msg, S.hostPeer);
}
// Host stuurt snapshot naar iedereen en verwerkt hem zelf.
function broadcast(){
  if (H) H.lastBeat = now();
  const snap = publicState();
  if (sendMsg) sendMsg({ t:'state', p: snap });
  onState(snap);
}

function onNet(msg, peerId){
  if (!msg || typeof msg !== 'object') return;
  if (isHost) return hostHandle(msg, peerId);
  switch (msg.t){
    case 'state':
      if (msg.p.hostPeer !== peerId) return;  // alleen de host is bron van waarheid
      clearTimeout(joinTimer); overlay(null); lastHostMsg = now();
      onState(msg.p); break;
    case 'reject': clearTimeout(joinTimer); overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t(msg.p); }); break;
    case 'kick': overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t('kicked'); }); break;
  }
}

// Watchdog: geen state van host voor 9s = host weg
let lastHostMsg = 0;
setInterval(() => {
  if (!room || isHost || !S || solo) return;
  if (now() - lastHostMsg > 9000 && !$('#ovLoad').classList.contains('on')) electHost(S.hostPeer);
}, 1000);
function onPeerLeave(peerId){
  if (isHost) {
    const p = H && H.players.find(p=>p.peerId===peerId);
    if (p) { p.connected = false; p.leftAt = Date.now(); checkAllAnswered(); broadcast(); }
    return;
  }
  if (S && peerId === S.hostPeer) electHost(peerId);
}

// Host migratie: verbonden speler met laagste joinIdx wordt host.
function electHost(oldHostPeer){
  if (isHost || !S || S.hostPeer !== oldHostPeer) return;
  lastHostMsg = now();
  const peers = room ? Object.keys(room.getPeers()) : [];
  const alive = S.players.filter(p => p.peerId !== oldHostPeer && (p.peerId === selfId || peers.includes(p.peerId)) && p.connected);
  alive.sort((a,b)=>a.joinIdx-b.joinIdx);
  const next = alive[0];
  if (!next) return;
  toast(t('hostLeft'));
  if (next.peerId === selfId) becomeHost(oldHostPeer);
  else {
    S.hostPeer = next.peerId;
    // stuur eigen antwoord opnieuw zodat de nieuwe host het kent
    setTimeout(()=>{ if (myAnswer && S.round && myAnswer.roundId===S.round.id) sendMsg({ t:'answer', p:{...myAnswer, resend:true} }, S.hostPeer); }, 1500);
  }
}
function becomeHost(oldHostPeer){

    players: snap.players.map(p => ({ ...p, connected: p.peerId===oldHostPeer ? false : p.connected, leftAt: p.peerId===oldHostPeer ? Date.now() : null })),
    settings: snap.settings, phase: snap.phase, roundN: snap.roundN, used: snap.used || [],
    nextJoin: Math.max(...snap.players.map(p=>p.joinIdx)) + 1, result: snap.result, final: snap.final, round: null, blocked: [],
  };
  if (snap.phase === 'round' && snap.round){
    const r = snap.round;
    const code = countryAt(r.lat, r.lng);
    const elapsed = r.durationMs - Math.max(0, r.remainingMs - (now()-recvAt));
    H.round = { ...r, code, hintKeys: [...r.hints.map(h=>h.k), ...chooseHints(code, r.hintTotal, snap.settings.hintGroups).filter(k=>!r.hints.some(h=>h.k===k))].slice(0, r.hintTotal),
      startAt: now() - elapsed, answers: {}, order: 0, forced: r.hints.length, wants: {} };
    if (myAnswer && myAnswer.roundId === r.id) H.round.answers[me.id] = { ...myAnswer, at: now(), order: H.round.order++ };

/* ================= HOST LOGIC ================= */
function hostInit(){
  isHost = true;
  H = { players: [], settings: { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('lr_settings')||'{}') }, phase:'lobby', roundN:0, used:[], nextJoin:0, round:null, result:null, final:null, blocked:[] };
  hostAddPlayer({ ...helloPayload() }, selfId);
  startHostLoop();
  broadcast();
}
function hostAddPlayer(p, peerId){
  let pl = H.players.find(x => x.id === p.id);
  if (pl) { pl.peerId = peerId; pl.connected = true; pl.leftAt = null; pl.name = String(p.name).slice(0,16); pl.color = p.color; return true; }
  if (H.blocked.includes(p.id)) return 'kicked';
  if (H.phase !== 'lobby') return 'started';
  if (H.players.filter(x=>x.connected || (Date.now()-x.leftAt) < CONFIG.reserveMs).length >= CONFIG.maxPlayers) return 'full';
  H.players.push({ id: p.id, peerId, name: String(p.name||'?').slice(0,16), color: COLORS.includes(p.color)?p.color:COLORS[0], joinIdx: H.nextJoin++, score:0, connected:true, leftAt:null, correct:0, best:0, fastest:null });
  return true;
}
function hostHandle(msg, peerId){
  const p = msg.p || {};
  const player = H.players.find(x => x.peerId === peerId);
  switch (msg.t){
    case 'hello': {
      const res = hostAddPlayer(p, peerId);
      if (res !== true) { sendMsg && sendMsg({ t: res==='kicked'?'kick':'reject', p: res }, peerId); return; }
      broadcast(); beep(880,.06); break;
    }
    case 'sync': broadcast(); break;
    case 'settings':
      if (peerId !== selfId || H.phase !== 'lobby') return;
      if (Array.isArray(p.hintGroups)){ p.hintGroups = p.hintGroups.filter(g=>HINT_GROUPS.includes(g)); if (!p.hintGroups.length) return; }
      H.settings = { ...H.settings, ...p }; localStorage.setItem('lr_settings', JSON.stringify(H.settings)); broadcast(); break;
    case 'wanthint': {
      if (!player || H.phase !== 'round' || !H.round) return;
      const r = H.round; if (r.hints.length >= r.hintKeys.length) return;
      r.wants[player.id] = true;
      const cp = connectedPlayers();
      if (cp.length && cp.every(x => r.wants[x.id])) { r.forced = r.hints.length + 1; releaseHints(); }
      broadcast(); break;
    }
    case 'start':
      if (peerId !== selfId) return;
      if (H.phase === 'lobby' || H.phase === 'result') nextRound(); break;
    case 'kick': {
      if (peerId !== selfId) return;
      const target = H.players.find(x=>x.id===p.id); if (!target || target.peerId===selfId) return;
      H.blocked.push(target.id); H.players = H.players.filter(x=>x!==target);
      sendMsg && sendMsg({ t:'kick' }, target.peerId); broadcast(); break;
    }
    case 'answer': {
      if (!player || H.phase !== 'round' || !H.round || p.roundId !== H.round.id) return;
      if (H.round.answers[player.id]) return;  // eerste telt
      if (!COUNTRIES[p.code]) return;
      const el = now() - H.round.startAt;
      let hintsSeen = H.round.hints.length, frac = Math.max(0, 1 - el / H.round.durationMs);

    case 'rematch':

      H.phase = 'lobby'; H.roundN = 0; H.used = []; H.result = null; H.final = null; H.round = null;
      H.players = H.players.filter(x=>x.connected);

}
async function nextRound(){
  const h = H;

  if (h.finding) return;
  if (h.roundN >= h.settings.rounds) return finish();
  let loc = null;
  if (h.settings.mode === 'street'){
    h.finding = true; overlay(t('findingPhoto'));
    loc = await findPhoto(h.settings, h.used).catch(()=>null);
    overlay(null); h.finding = false;
    if (H !== h) return;  // host is tijdens het zoeken vertrokken
    if (!loc) toast(t('noPhoto'));
  }
  loc = loc || randomLocation(H.settings, H.used);
  if (!loc) return finish();
  H.used.push(loc.code); H.roundN++;
  const durationMs = H.settings.roundTime*1000, hintIntervalMs = H.settings.hintEvery*1000;
  const wanted = Math.min(H.settings.hintCount || 6, Math.max(2, Math.ceil(durationMs / hintIntervalMs)));
  const hintKeys = chooseHints(loc.code, wanted, H.settings.hintGroups), hintTotal = hintKeys.length;
  H.round = { id: Math.random().toString(36).slice(2,9), n: H.roundN, lat: loc.lat, lng: loc.lng, code: loc.code, photo: loc.photo || null,
    zoom: CONFIG.zoom[H.settings.difficulty], pan: CONFIG.pan[H.settings.difficulty], difficulty: H.settings.difficulty,
    durationMs, hintIntervalMs, hintTotal, hintKeys, hints: [], startAt: now(), answers: {}, order: 0, forced: 0, wants: {} };

    const k = r.hintKeys[r.hints.length];
    r.hints.push({ k, v: hintValue(k, r.code, r) });
    changed = true;
  }

  return changed;
}
function connectedPlayers(){
  const peers = room ? Object.keys(room.getPeers()) : [];
  return H.players.filter(p => p.peerId === selfId || (p.connected && peers.includes(p.peerId)));
}
function checkAllAnswered(){
  if (H.phase !== 'round' || !H.round) return false;

  if (cp.length && cp.every(p => H.round.answers[p.id])) { endRound(); return true; }
  return false;

function startHostLoop(){

    if (H.phase === 'lobby'){
      const before = H.players.length;
      H.players = H.players.filter(p => p.connected || Date.now()-p.leftAt < CONFIG.reserveMs);
      if (H.players.length !== before) broadcast();
    }
    if (now() - (H.lastBeat||0) > 3000) { H.lastBeat = now(); broadcast(); return; }
    if (H.phase !== 'round' || !H.round) return;
    if (releaseHints()) broadcast();

function scoreFor(ans, code){

  if (ans.code === code){
    const extra = Math.max(0, ans.hintsSeen - 1);
    const raw = (S_.correct - S_.perHint*extra) * (S_.timeBase + S_.timeWeight*ans.frac);
    return { pts: Math.round(Math.max(S_.min, raw)), kind:'good' };
  }
  if (COUNTRIES[ans.code] && COUNTRIES[ans.code].cont === COUNTRIES[code].cont) return { pts: S_.continent, kind:'half' };

}

    if (s.pts > p.best) p.best = s.pts;
    return { id:p.id, guess: a ? a.code : null, ms: a ? a.ms : null, hints: a ? a.hintsSeen : null, pts: s.pts, kind: s.kind, total: p.score, order: a ? a.order : 99 };

function finish(){

}
function publicState(){

    players: H.players.map(({id,peerId,name,color,joinIdx,score,connected,correct,best,fastest}) => ({id,peerId,name,color,joinIdx,score,connected,correct,best,fastest})),
    round: r ? { id:r.id, n:r.n, lat:r.lat, lng:r.lng, photo:r.photo, zoom:r.zoom, pan:r.pan, difficulty:r.difficulty, durationMs:r.durationMs, hintIntervalMs:r.hintIntervalMs, hintTotal:r.hintTotal,

/* ================= CLIENT RENDER ================= */

let pannellumReady = null;
function loadPannellum(){

    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum';
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + '.css';
    const js = document.createElement('script'); js.src = base + '.js'; js.onload = res;

function dropPano(){ if (pano){ pano.destroy(); pano = null; } }
function photoView(p){
  if (p.pano) return { hfov:100, minHfov:35, maxHfov:120 };

  const el = $('#pano'), vaov = p.fov*p.ratio, hfov = Math.min(p.fov, vaov*el.clientWidth/el.clientHeight)*.85;

function upgradePano(r){

function tick(){
  if (!S) return;
  if (S.phase === 'round' && S.round){
    const r = S.round;
    const rem = r.remainingMs - (now() - recvAt) - latency;
    setTimer(fmtTime(rem)); $('#timerChip').parentElement.classList.toggle('low', rem < 10000);
    $('#timerBar').style.transform = `scaleX(${Math.max(0, Math.min(1, rem / r.durationMs))})`;
    const elapsed = r.durationMs - rem;
    const nextIdx = r.hints.length;
    if (nextIdx < r.hintTotal){
      const into = elapsed - (nextIdx-1)*r.hintIntervalMs;
      $('#hintBar').style.width = Math.min(100, Math.max(0, into / r.hintIntervalMs * 100)) + '%';
      $('#nextSecs').textContent = Math.max(0, Math.ceil((nextIdx*r.hintIntervalMs - elapsed)/1000)) + 's';
      $('#nextHint').style.display = '';
    } else $('#nextHint').style.display = 'none';
  }
  if (S.phase === 'result' && S.result){
    const left = S.result.nextAt - (now()-recvAt);
    $('#resTimer').textContent = S.result.last ? '' : t('nextIn', { s: Math.max(0, Math.ceil(left/1000)) });
    $('#resTimer').style.display = S.result.last ? 'none' : '';
  }
}

let acItems = [], acSel = 0;
function search(q){
  const n = norm(q); if (!n) return [];
  const res = [];
  for (const s of SEARCH){
    let best = 99;
    for (const k of s.keys){ const i = k.indexOf(n); if (i===0) best = Math.min(best, 0); else if (i>0) best = Math.min(best, 1); }
    if (best < 99) res.push({ code:s.code, score: best + cname(s.code).length/100 });
  }
  return res.sort((a,b)=>a.score-b.score).slice(0,6).map(r=>r.code);
}

  const hl = name => { const n = esc(name); const i = norm(name).indexOf(q); if (i !== 0 || !q) return n; let seen = 0, end = 0; for (let j=0;j<name.length && seen<q.length;j++){ if (norm(name[j])) seen++; end = j+1; } return `<mark>${esc(name.slice(0,end))}</mark>${esc(name.slice(end))}`; };
  ac.innerHTML = acItems.map((c,i)=>`<div class="${i===acSel?'sel':''}" data-code="${c}">${flagImg(c,40)}<span>${hl(cname(c))}</span></div>`).join('');

}

let sendChat = null, chatLog = [], unread = 0;
function updateChat(){
  const on = !!room && !solo && document.body.dataset.screen && document.body.dataset.screen !== 'start';
  $('#chatBtn').classList.toggle('show', on);
  if (!on) $('#chat').classList.remove('on');
}
function renderChat(){
  const log = $('#chatLog'); if (!log) return;
  log.innerHTML = chatLog.length ? chatLog.map(m => `<div class="msg ${m.mine?'me':''}"><small>${m.mine?'':dotHtml({color:m.color})}${m.mine?'':esc(m.name)}</small><p>${esc(m.text)}</p></div>`).join('') : `<div class="cempty">${t('chatEmpty')}</div>`;
  log.scrollTop = log.scrollHeight;
  const b = $('#chatBadge'); b.textContent = unread; b.classList.toggle('on', unread > 0);
}
function addChat(m){ chatLog.push(m); if (chatLog.length > 200) chatLog.shift(); if (!m.mine && !$('#chat').classList.contains('on')){ unread++; beep(880,.05); } renderChat(); }
function receiveChat(m){
  if (!m || typeof m.text !== 'string' || !m.text.trim()) return;
  addChat({ name: String(m.name||'?').slice(0,16), color: COLORS.includes(m.color)?m.color:'#888', text: m.text.slice(0,500), mine:false });
}
$('#chatBtn').addEventListener('click', () => { $('#chat').classList.add('on'); unread = 0; renderChat(); $('#chatIn').focus(); });
$('#chatClose').addEventListener('click', () => $('#chat').classList.remove('on'));
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault(); const text = $('#chatIn').value.trim(); if (!text || !sendChat) return;
  $('#chatIn').value = ''; sendChat({ name: me.name, color: me.color, text });
  addChat({ name: me.name, color: me.color, text, mine:true });
});
$('#chatIn').addEventListener('keydown', e => e.stopPropagation());

/* ================= BOOT ================= */
(async function boot(){
  $('#name').value = me.name; renderColors(); applyI18n(); show('start');
  try { await loadData(); } catch(e){ overlay(t('dataFail')); return; }
  const m = location.hash.match(/room=([A-Z0-9]{4})/i);
  if (m){ $('#codeIn').value = m[1].toUpperCase(); if (me.name) joinAsPeer(m[1].toUpperCase()); }
})();
</script>
</body>
