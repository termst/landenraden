/* ================= DATA ================= */
let COUNTRIES = {}, GEO = {}, SEARCH = [];
async function loadData(){
  overlay(t('loading'));
  const [c, g] = await Promise.all([fetch('data/countries.json').then(r=>r.json()), fetch('data/countries.geojson').then(r=>r.json())]);
  COUNTRIES = c; buildCurrencies();
  // Buurlanden die niet in onze lijst staan (Gibraltar, Frans-Guyana) gaven een "?" in de hints.
  for (const x of Object.values(COUNTRIES)) x.nb = x.nb.filter(n => COUNTRIES[n]);
  for (const f of g.features){
    const polys = f.geometry.coordinates.map(rings => {
      const outer = rings[0]; let minX=180,minY=90,maxX=-180,maxY=-90, a=0;
      for (let i=0;i<outer.length;i++){ const [x,y]=outer[i]; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        const n=outer[(i+1)%outer.length]; a += x*n[1]-n[0]*y; }
      const area = Math.abs(a/2) * Math.cos(((minY+maxY)/2)*Math.PI/180);
      return { rings, bbox:[minX,minY,maxX,maxY], area };
    });
    // Middelpunt van het grootste deel (gemiddelde van de punten van de buitenrand): voor halfrond, klimaat en "vanaf"-hint.
    const main = polys.reduce((a,b)=>b.area>a.area?b:a).rings[0], mid = main.reduce((s,[x,y])=>[s[0]+y, s[1]+x], [0,0]).map(v=>v/main.length);
    GEO[f.properties.c] = { feature: f, polys, area: polys.reduce((s,p)=>s+p.area,0), mid };
  }
  for (const [code, c] of Object.entries(COUNTRIES)){
    if (!GEO[code]) continue;
    const names = new Set([c.nl, c.en, ...c.alias]);
    SEARCH.push({ code, keys: [...names].map(norm).filter(Boolean) });
  }
  overlay(null);
}

/* ================= GEOMETRY ================= */
function inRing(x, y, ring){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
const inPoly = (x,y,p) => inRing(x,y,p.rings[0]) && !p.rings.slice(1).some(h=>inRing(x,y,h));
function countryAt(lat, lng){
  for (const [code, g] of Object.entries(GEO)) for (const p of g.polys){
    const [a,b,c,d]=p.bbox; if (lng>=a&&lng<=c&&lat>=b&&lat<=d && inPoly(lng,lat,p)) return code;
  }
  return null;
}
function pickWeighted(items, w){ let s=items.reduce((a,i)=>a+w(i),0), r=Math.random()*s; for(const i of items){ r-=w(i); if(r<=0) return i; } return items[items.length-1]; }
function countryPool(s, used){
  const fits = c => COUNTRIES[c] && (s.continent==='ALL' || COUNTRIES[c].cont===s.continent);
  const pool = Object.keys(GEO).filter(c => fits(c) && !used.includes(c) && (s.small || !COUNTRIES[c].small));
  return pool.length ? pool : Object.keys(GEO).filter(fits);
}
const pickCountry = (s, pool) => s.weighting==='area' ? pickWeighted(pool, c=>GEO[c].area) : rnd(pool);
function pointIn(code){
  const poly = pickWeighted(GEO[code].polys, p=>p.area), [a,b,c,d] = poly.bbox;
  for (let i=0;i<200;i++){
    const lng = a + Math.random()*(c-a), lat = b + Math.random()*(d-b);
    if (inPoly(lng, lat, poly)) return { code, lat:+lat.toFixed(4), lng:+lng.toFixed(4), poly };
  }
  return null;
}
function randomLocation(s, used){
  let pool = countryPool(s, used);
  while (pool.length){
    const code = pickCountry(s, pool), spot = pointIn(code);
    if (spot) return spot;
    pool = pool.filter(x=>x!==code);
  }
  return null;
}

/* ================= SILHOUET ================= */
// Host: een punt in het hoofddeel, zo dicht mogelijk bij het midden. Fout gokken telt dan vanaf het hart van het land, niet vanaf een toevallige plek.
// ok: alleen landen die hieraan voldoen (Grens trekken: groot genoeg). Zijn die op, dan herhalen, en anders elk land.
function shapeLocation(s, used, ok){
  let pool = countryPool(s, used);
  if (ok){ const f = pool.filter(ok), g = f.length ? f : countryPool(s, []).filter(ok); if (g.length) pool = g; }
  while (pool.length){
    const code = pickCountry(s, pool), main = GEO[code].polys.reduce((a,b)=>a.area>b.area?a:b), [a,b,c,d] = main.bbox, mx = (a+c)/2, my = (b+d)/2;
    let best = null, bd = Infinity;
    for (let i = 0; i < 400; i++){
      const lng = a + Math.random()*(c-a), lat = b + Math.random()*(d-b), dd = (lng-mx)**2 + (lat-my)**2;
      if (dd < bd && inPoly(lng, lat, main) && countryAt(lat, lng) === code){ bd = dd; best = { code, lat:+lat.toFixed(4), lng:+lng.toFixed(4) }; }
    }
    if (best) return best;
    pool = pool.filter(x=>x!==code);
  }
  return null;
}
// Hoe de vorm getoond wordt. Iedereen tekent hem zelf uit de eigen GeoJSON, de host stuurt alleen dit.
function shapeSpec(diff){
  const C = CONFIG.shape;
  if (diff === 'easy') return { rot:0, flip:false, keep:C.keep.easy, main:false, grid:true };
  if (diff === 'normal') return { rot:Math.round((Math.random()<.5?-1:1) * (C.rot[0] + Math.random()*(C.rot[1]-C.rot[0]))), flip:false, keep:C.keep.normal, main:false, grid:false };
  return { rot:Math.round(Math.random()*360), flip:Math.random() < C.flipChance, keep:1, main:true, grid:false };
}
// Vorm als SVG. Lengte geschaald met cos(breedte) rond het midden van het hoofddeel, over de datumgrens heen gevouwen.
// Uitkomst in eenheden van 1 breedtegraad x S, zodat de schaal (111 km per graad) klopt.
// Welke delen meedoen en de projectie: midden en cos(breedte) van het hoofddeel. Ook voor Grens trekken.
function shapeBase(code, sh){
  const g = GEO[code]; if (!g) return null;
  const C = CONFIG.shape, main = g.polys.reduce((a,b)=>a.area>b.area?a:b), [a,b,c,d] = main.bbox;
  const cx = (a+c)/2, cy = (b+d)/2, k = Math.cos(cy*Math.PI/180), wrap = x => ((x + 540) % 360) - 180;
  const dim = Math.max((c-a)*k, d-b) || 1, reach = Math.min(C.reachMax, Math.max(C.reachMin, dim*C.reach));
  const near = p => { const [pa,pb,pc,pd] = p.bbox; return Math.hypot(wrap((pa+pc)/2 - cx)*k, (pb+pd)/2 - cy) <= reach; };
  const keep = g.polys.filter(p => p === main || (!sh.main && p.area >= main.area*sh.keep && near(p)));
  return { keep, cx, cy, k, dim, wrap };
}
function shapeSvg(code, sh, mini){
  const B = sh && shapeBase(code, sh); if (!B) return '';
  const C = CONFIG.shape, { keep, cx, cy, k, dim, wrap } = B;
  const S = 1000/dim, th = sh.rot*Math.PI/180, cs = Math.cos(th), sn = Math.sin(th), fx = sh.flip ? -1 : 1;
  const P = (x, y) => { const u = wrap(x - cx)*k*fx*S, v = (cy - y)*S; return [u*cs - v*sn, u*sn + v*cs]; };
  const tol = mini ? 8 : 1.5;   // punten dichter bij elkaar dan dit vallen weg (Rusland en Canada hebben er duizenden)
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const paths = keep.map(p => p.rings.map(r => {
    const pts = [];
    for (const [x, y] of r){ const q = P(x, y), l = pts[pts.length-1]; if (!l || Math.abs(q[0]-l[0]) + Math.abs(q[1]-l[1]) > tol) pts.push(q); }
    if (pts.length < 3) return '';
    for (const [x, y] of pts){ if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
    return 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L') + 'Z';
  }).join('')).filter(Boolean);
  const w = x1-x0, h = y1-y0, pad = Math.max(w, h) * C.pad, padB = sh.grid && !mini ? Math.max(w, h)*.14 : pad;
  const vb = [x0-pad, y0-pad, w+2*pad, h+pad+padB];
  let extra = '';
  if (sh.grid && !mini){
    // Lengte en breedtelijnen zonder getallen: ze geven maat, geen ligging. Een rond aantal graden, 3 tot 6 lijnen.
    const span = Math.max(w, h)/S, step = [1,2,5,10,15,20,30].find(s => span/s <= 6) || 30;
    const lng0 = cx + (vb[0]/S)/k, lng1 = cx + ((vb[0]+vb[2])/S)/k, lat0 = cy - (vb[1]+vb[3])/S, lat1 = cy - vb[1]/S;
    for (let L = Math.ceil(lng0/step)*step; L <= lng1; L += step){ const X = ((L - cx)*k*S).toFixed(1); extra += `<line class="grat" x1="${X}" y1="${vb[1]}" x2="${X}" y2="${vb[1]+vb[3]}"/>`; }
    for (let L = Math.ceil(lat0/step)*step; L <= lat1; L += step){ const Y = ((cy - L)*S).toFixed(1); extra += `<line class="grat" x1="${vb[0]}" y1="${Y}" x2="${vb[0]+vb[2]}" y2="${Y}"/>`; }
    // Schaal: een rond getal km, ongeveer een kwart van de breedte.
    const want = vb[2]/4/S*111.32, mag = Math.pow(10, Math.floor(Math.log10(want))), km = [5,2,1].map(f=>f*mag).find(v => v <= want) || mag;
    const len = km/111.32*S, sx = x0, sy = y1 + padB*.55, fs = (Math.max(w,h)*.035).toFixed(1), tk = (Math.max(w,h)*.015).toFixed(1);
    extra += `<g class="scale"><line x1="${sx}" y1="${sy}" x2="${sx+len}" y2="${sy}"/><line x1="${sx}" y1="${sy-tk}" x2="${sx}" y2="${sy+ +tk}"/><line x1="${sx+len}" y1="${sy-tk}" x2="${sx+len}" y2="${sy+ +tk}"/>`
      + `<text x="${sx+len+ +fs*.5}" y="${sy}" font-size="${fs}" dominant-baseline="middle">${km.toLocaleString(lang === 'nl' ? 'nl-NL' : 'en-GB')} km</text></g>`;
  }
  const body = paths.map(d => `<path class="sil" pathLength="1" fill-rule="evenodd" d="${d}"/>`).join('');
  return `<svg viewBox="${vb.map(v=>v.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${extra}<g class="shadow">${body}</g></svg>`;
}

/* ================= STRAATBEELD ================= */
const inCountry = (code, lng, lat) => GEO[code].polys.some(p => { const [a,b,c,d]=p.bbox; return lng>=a&&lng<=c&&lat>=b&&lat<=d&&inPoly(lng,lat,p); });
const is360 = f => f.properties['pers:interior_orientation']?.field_of_view === 360;
// Host laadt de foto vooraf: een kapotte foto mag geen ronde starten.
function loadPhoto(f){
  const pano = is360(f), o = f.properties['pers:interior_orientation'] || {}, sd = f.assets?.sd?.href;
  return new Promise(res => {
    if (!sd) return res(null);
    const img = new Image(), timer = setTimeout(()=>res(null), CONFIG.street.loadMs);
    img.crossOrigin = 'anonymous';
    img.onerror = () => { clearTimeout(timer); res(null); };
    img.onload = () => { clearTimeout(timer); res({
      sd, pano, hd: pano ? f.assets.hd?.href : null, w: o.sensor_array_dimensions?.[0] || 0,
      fov: o.field_of_view || CONFIG.street.flatFov, ratio: img.naturalHeight / img.naturalWidth,
      by: f.providers?.[0]?.name || '', lic: f.properties.license || '',
    }); };
    img.src = sd;
  });
}
async function photoNear({ code, lat, lng, poly }){
  const [a,b,c,d] = poly.bbox, r = CONFIG.street.radius;
  const boxes = [[Math.max(a,lng-r), Math.max(b,lat-r), Math.min(c,lng+r), Math.min(d,lat+r)], [a,b,c,d]];
  for (const box of boxes){
    const res = await fetch(`${CONFIG.street.api}?bbox=${box.join(',')}&limit=${CONFIG.street.limit}`);
    if (!res.ok) throw new Error('search ' + res.status);
    const hits = ((await res.json()).features || []).filter(f => inCountry(code, ...f.geometry.coordinates));
    const panos = hits.filter(is360);
    if (!hits.length) continue;
    const f = rnd(panos.length ? panos : hits), photo = await loadPhoto(f);
    if (photo){ const [x,y] = f.geometry.coordinates; return { code, lng:+x.toFixed(4), lat:+y.toFixed(4), photo }; }
  }
  return null;
}
async function findPhoto(s, used){
  let pool = countryPool(s, used);
  for (let i=0; i<CONFIG.street.tries && pool.length; i++){
    const code = pickCountry(s, pool), spot = pointIn(code), found = spot && await photoNear(spot).catch(()=>null);
    if (found) return found;
    pool = pool.filter(x=>x!==code);
  }
  return null;
}

/* ================= GRENS TREKKEN ================= */
// Iedereen tekent de omtrek van hetzelfde land op een leeg vel. Een tekening is een lijst lussen [x,y,x,y...] op een vel van size x size,

// Vage hints die binnen het werelddeel bijna iedereen deelt (halfrond, klimaat in Europa) zeggen niets en kosten wel punten.
const INFO_KEYS = new Set(['hemi','climate','drive','coast','size','pop','nbcount','telzone','curshare','sub','gov','org','inc','rel','script']);
function hintShare(h, code, c){
  const key = x => JSON.stringify(hintValue(h.k, x)), mine = key(code);
  const pool = Object.keys(GEO).filter(x => COUNTRIES[x] && COUNTRIES[x].cont === c.cont && h.ok(COUNTRIES[x], x));

// cont: het werelddeel van de lobby of de toernooironde. Staat dat vast, dan is de continent-hint niets waard.
// skip: hints die deze ronde niet mogen (Tekenen: de vlag is daar zelf het raadsel).
function chooseHints(code, count, groups, cont, skip){
  const nl = !!CITIES[code], c = nl ? CITIES[code] : COUNTRIES[code], defs = nl ? nlDefs : HINT_DEFS;
  const on = (groups && groups.length) ? groups : HINT_GROUPS;
  const fixed = !nl && cont && cont !== 'ALL';
  const useful = h => nl || !INFO_KEYS.has(h.k) || hintShare(h, code, c) <= 0.8;
  const base = defs.filter(h => h.ok(c, code) && !(fixed && h.k === 'cont') && (count >= 8 || h.k !== 'name') && !(skip && skip.includes(h.k)));
  let avail = base.filter(h => (nl || on.includes(h.g)) && useful(h));
  if (!avail.length) avail = base.filter(useful);
  if (!avail.length) avail = base;
  // De eerste hint is gratis: altijd een vage. Zonder continent eerst de regio.
  const first = avail.find(h=>h.k==='cont') || (fixed && avail.find(h=>h.k==='sub')) || avail.slice().sort((a,b)=>a.r-b.r)[0];
  const lates = avail.filter(h=>h.late && h!==first);
  const last = lates.length ? rnd(lates) : avail.filter(h=>h!==first).sort((a,b)=>b.r-a.r)[0];
  const used = new Set([first && first.f, last && last.f]);

  const need = Math.max(0, count-2), byG = {};

  for (let more = true; more && middle.length < need; ){
    more = false;
    for (const g of gs){
      if (middle.length >= need) break;
      let h; while ((h = byG[g].shift()) && used.has(h.f));
      if (h){ used.add(h.f); middle.push(h); more = true; }
    }
  }
  middle.sort((a,b)=>a.r-b.r);
  return [...new Set([first, ...middle, last].filter(Boolean))].slice(0, count).map(h=>h.k);
}
// Host: ruwe, taalneutrale waarde. Client: tekst in eigen taal.
function hintValue(k, code, loc){
  if (k.startsWith('q_')) return huntHintValue(k, loc);

  const c = COUNTRIES[code];
  const nm = l => { const n = c[l] || c.en; return { l: n[0], n: n.replace(/[^\p{L}]/gu,'').length }; };
  // Halfrond en klimaat gaan over het land (middelpunt), niet over de plek van deze ronde.
  const mid = GEO[code] && GEO[code].mid, lat = mid ? mid[0] : loc ? loc.lat : 0, lng = mid ? mid[1] : loc ? loc.lng : 0;
  switch(k){
    case 'cont': return c.cont; case 'sub': return c.sub; case 'drive': return c.drive;
    case 'coast': return { land: c.land, isl: !c.nb.length }; case 'pop': return c.pop;
    case 'nbcount': return c.nb.length; case 'telzone': return c.tel[1];
    case 'caplen': return c.cap.replace(/[^\p{L}]/gu,'').length;
    case 'anchor': return anchorOf(code);
    case 'area_nl': { const x = c.area / COUNTRIES.NL.area; return x >= 1 ? { x: sig2(x) } : { y: sig2(1/x) }; }
    case 'lang': return c.lang; case 'tel': return c.tel; case 'tld': return c.tld;
    case 'cur': case 'cursym': return CODES[code];
    case 'curshare': return { n: Math.max(0, (CURCOUNT[CODES[code][0]]||1) - 1) };
    case 'nb': return c.nb; case 'nb1': return rnd(c.nb);
    case 'cap': return c.cap[0]; case 'name': return { nl: nm('nl'), en: nm('en') };
    case 'namelen': return { nl: nm('nl').n, en: nm('en').n };
    case 'flag': return code;
    case 'gov': return c.gov; case 'org': return c.org; case 'indy': return c.ind; case 'indfrom': return c.from; case 'owner': return [c.of];
    case 'oldname': return c.old; case 'inc': return c.inc; case 'exp': return c.exp; case 'brand': return c.brand;
    case 'rel': return c.rel; case 'script': return c.script; case 'sport': return c.sport; case 'dish': return c.dish;
    case 'olym': return c.oly; case 'wcup': return c.wc;

}

// Eén JSON-blok onder lr_stats: totalen, beste per modus en de laatste potjes. Elke speler houdt alleen zijn eigen cijfers bij.
const STATS_KEY = 'lr_stats', HIST_MAX = 25;

function cleanStats(s){
  s = s && typeof s === 'object' ? s : {};
  const out = { v:1, games:cnt(s.games), multi:cnt(s.multi), wins:cnt(s.wins), rounds:cnt(s.rounds), correct:cnt(s.correct), points:cnt(s.points),
    bestGame:cnt(s.bestGame), bestAvg:cnt(s.bestAvg, 2000), bestRound:cnt(s.bestRound), fastest:cnt(s.fastest) || null, modes:{}, hist:[] };
  for (const m of SETTING_OPTS.mode){ const x = s.modes && s.modes[m]; if (x && cnt(x.games)) out.modes[m] = { games:cnt(x.games), best:cnt(x.best), bestAvg:cnt(x.bestAvg, 2000) }; }
  if (Array.isArray(s.hist)) out.hist = s.hist.filter(h => h && typeof h.gid === 'string' && SETTING_OPTS.mode.includes(h.mode)).slice(0, HIST_MAX)
    .map(h => ({ gid:h.gid.slice(0,40), at:cnt(h.at,1e14), mode:h.mode, rounds:cnt(h.rounds,99), players:cnt(h.players,9) || 1, rank:cnt(h.rank,9) || 1, score:cnt(h.score), correct:cnt(h.correct,99) }));

  for (const h of out.hist){

    out.bestAvg = Math.max(out.bestAvg, avg);
    if (md) md.bestAvg = Math.max(md.bestAvg, avg);

}
// Een potje van 15 rondes heeft meer punten dan een van 5. Vergelijken gaat daarom per ronde.
const gameAvg = (score, rounds) => rounds ? Math.round(score / rounds) : 0;

const saveStats = () => store.set(STATS_KEY, JSON.stringify(stats));
// Wordt bij elk eindscherm aangeroepen. De game-id voorkomt dubbel tellen (opnieuw tekenen, hostwissel, pagina herladen).
function recordGame(){
  const F = S && S.final; if (!F || !Array.isArray(F.ranking)) return;
  const mine = F.ranking.find(r => r.id === me.id); if (!mine) return;
  const gid = String(F.gid || (roomCode || 'solo') + F.ranking.map(r => r.score).join('.')).slice(0,40);   // oudere host zonder gid
  if (stats.hist.some(h => h.gid === gid)) return;
  const players = F.ranking.length, rank = 1 + F.ranking.filter(r => r.score > mine.score).length, mode = S.settings.mode;
  const avg = gameAvg(mine.score, S.roundN), record = stats.games > 0 && avg > stats.bestAvg;
  stats.games++; stats.rounds += S.roundN; stats.correct += mine.correct; stats.points += mine.score;
  if (players > 1){ stats.multi++; if (rank === 1) stats.wins++; }
  stats.bestGame = Math.max(stats.bestGame, mine.score); stats.bestAvg = Math.max(stats.bestAvg, avg); stats.bestRound = Math.max(stats.bestRound, mine.best || 0);
  if (mine.fastest != null && (!stats.fastest || mine.fastest < stats.fastest)) stats.fastest = mine.fastest;
  const md = stats.modes[mode] = stats.modes[mode] || { games:0, best:0, bestAvg:0 };
  md.games++; md.best = Math.max(md.best, mine.score); md.bestAvg = Math.max(md.bestAvg || 0, avg);
  stats.hist.unshift({ gid, at:Date.now(), mode, rounds:S.roundN, players, rank, score:mine.score, correct:mine.correct });
  stats.hist.length = Math.min(stats.hist.length, HIST_MAX);
  saveStats();

  if (stats.games === 1 && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}

let room = null, roomCode = null, isHost = false, solo = false;

// Eén maak-, join- of solo-actie tegelijk. Een tweede klik of Enter startte anders een tweede zoektimer die niemand meer stopte:
// je kwam binnen en werd 15 s later met "kamer niet gevonden" uit de lobby gezet. Een nieuwe kamer wacht ook tot de vorige verlaten is.
let entering = false, leaving = Promise.resolve();
const busy = () => entering || !!room || !!S;
async function enter(fn){
  if (busy()) return;
  entering = true;

}

/* ================= NETWORK ================= */
function connect(code){
  roomCode = code;
  if (netSelf) selfId = netSelf;
  room = joinRoom({ appId: CONFIG.appId, turnConfig: CONFIG.turn.length ? CONFIG.turn : undefined }, 'LR-' + code, { onJoinError: () => {
    // De kamer is wel gevonden, maar het netwerk laat geen directe verbinding toe. Dat is iets anders dan "kamer niet gevonden".
    if (S || isHost || code !== roomCode) return;
    clearTimeout(joinTimer); overlay(null); disconnect().then(() => { show('start'); $('#startErr').textContent = t('connFail'); });
  } });
  const action = room.makeAction('m');
  sendMsg = (msg, target) => action.send(msg, target ? { target } : undefined).catch(()=>{});
  action.onMessage = (msg, ctx) => onNet(msg, ctx.peerId);
  const chatAct = room.makeAction('c');
  sendChat = msg => chatAct.send(msg).catch(()=>{});
  chatAct.onMessage = (m, ctx) => receiveChat(m, typeof ctx === 'string' ? ctx : ctx && ctx.peerId);
  room.onPeerJoin = peerId => {
    if (isHost) return; // host wacht op hello
    sendMsg({ t:'hello', p: helloPayload() }, peerId);
  };
  room.onPeerLeave = peerId => onPeerLeave(peerId);
  location.hash = 'room=' + code;
}
const helloPayload = () => ({ id: me.id, name: me.name, color: me.color, avatar: me.avatar });
function disconnect(){ return leaving = leaving.then(doDisconnect, doDisconnect); }
async function doDisconnect(){
  clearTimeout(joinTimer); clearInterval(hostWatch);
  if (H) { clearInterval(H.loop); clearTimeout(H.autoNext); }
  if (room) { try { await room.leave(); } catch(e){} }
  room = null; sendMsg = null; sendChat = null; chatLog = []; unread = 0; $('#chat').classList.remove('on'); closeEmoTray(); $('#emoLayer').innerHTML = ''; isHost = false; solo = false; S = null; H = null; myAnswer = null; roomCode = null; lastSig = ''; HS = null; dartReset(null); DR = null; ovFinding = false;
  sabSeen = 0; sabOutId = null; sabUi();
  history.replaceState(null, '', location.pathname + location.search);
}

// Actie van mezelf: host verwerkt lokaal, peer stuurt naar host.
function act(msg){
  if (isHost) hostHandle(msg, selfId);
  else if (S && sendMsg) sendMsg(msg, S.hostPeer);
}
// Host stuurt snapshot naar iedereen en verwerkt hem zelf.
function broadcast(){
  if (H) H.lastBeat = now();
  const snap = publicState();
  if (sendMsg) sendMsg({ t:'state', p: snap });
  onState(snap);
}

function onNet(msg, peerId){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'draw' || msg.t === 'drawsync' || msg.t === 'drawfull') return drawNet(msg, peerId);   // tekening: tussen spelers, buiten de host om
  if (isHost && msg.t === 'state') return hostConflict(msg.p, peerId);
  if (isHost) return hostHandle(msg, peerId);
  switch (msg.t){
    case 'state':
      if (msg.p.hostPeer !== peerId) return;  // alleen de host is bron van waarheid
      clearTimeout(joinTimer); overlay(null); lastHostMsg = now();
      onState(msg.p); break;
    case 'reject': clearTimeout(joinTimer); overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t(msg.p); }); break;
    case 'kick': overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t('kicked'); }); break;
  }
}

// Watchdog: geen state van host voor 9s = host weg
let lastHostMsg = 0;
setInterval(() => {
  if (!room || isHost || !S || solo) return;
  if (now() - lastHostMsg > 9000 && (ovFinding || !$('#ovLoad').classList.contains('on'))) electHost(S.hostPeer);
}, 1000);
function onPeerLeave(peerId){
  if (isHost) {
    const p = H && H.players.find(p=>p.peerId===peerId);
    if (p) {
      p.connected = false; p.leftAt = Date.now();
      // Was deze speler de laatste die nog niet "hint nu" had gestemd? Dan gaat de hint nu door.
      checkWants();
      if (!checkSkip() && !checkAllAnswered()) broadcast();
    }
    return;
  }
  if (S && peerId === S.hostPeer) electHost(peerId);
}

// Host migratie: verbonden speler met laagste joinIdx wordt host.
function electHost(oldHostPeer){

  lastHostMsg = now();
  const peers = room ? Object.keys(room.getPeers()) : [];
  const alive = S.players.filter(p => p.peerId !== oldHostPeer && (p.peerId === selfId || peers.includes(p.peerId)) && p.connected);
  alive.sort((a,b)=>a.joinIdx-b.joinIdx);
  const next = alive[0];
  if (!next) return;
  toast(t('hostLeft'));
  if (next.peerId === selfId) becomeHost(oldHostPeer);
  else {
    S.hostPeer = next.peerId;
    // stuur eigen antwoord opnieuw zodat de nieuwe host het kent
    setTimeout(()=>{
      if (!S || !S.round || !sendMsg) return;
      if (myAnswer && myAnswer.roundId===S.round.id) sendMsg({ t:'answer', p:{...myAnswer, resend:true} }, S.hostPeer);
      else if (HS && HS.pin && HS.roundId===S.round.id) sendMsg({ t:'pin', p:{ roundId:HS.roundId, pin:HS.pin, scans:S.round.hunt.scans-HS.left } }, S.hostPeer);
      else if (DS && DS.pin && DS.roundId===S.round.id) sendMsg({ t:'pin', p:{ roundId:DS.roundId, pin:DS.pin, dbl:DS.dbl } }, S.hostPeer);

      if (!player || H.phase !== 'round' || !H.round || !H.round.photo || H.finding) return;

function ensureMap(){
  if (map) return map;
  // Bronvermelding linksboven: onderin valt hij achter het paneel met hints en antwoord.
  map = L.map('map', { zoomControl:false, attributionControl:false, worldCopyJump:true, zoomSnap:.25 });
  L.control.attribution({ position:'topleft' }).addTo(map);
  map.on('click', e => { if (S && S.phase === 'round' && S.round && S.round.hunt) huntTap(e.latlng); });
  addTiles(map);
  return map;
}
function addTiles(m){
  m.attributionControl.setPrefix(false);
  let failed = 0, usingFallback = false;
  const main = L.tileLayer(CONFIG.tiles.main.url, { attribution: CONFIG.tiles.main.attr, maxZoom: CONFIG.tiles.main.maxZoom, crossOrigin: true });
  main.on('tileerror', () => {
    if (usingFallback || ++failed < 4) return;
    usingFallback = true; m.removeLayer(main);
    L.tileLayer(CONFIG.tiles.fallback.url, { attribution: CONFIG.tiles.fallback.attr, maxZoom: CONFIG.tiles.fallback.maxZoom }).addTo(m);
  });
  main.addTo(m);
}

function showMap(r){
  $('#map').hidden = false; $('#pano').hidden = true;
  const m = ensureMap(), lock = r.pan === 0;
  m.invalidateSize();
  m.setMinZoom(0); m.setMaxZoom(18); m.setMaxBounds(null);
  m.setView([r.lat, r.lng], r.zoom, { animate:false });
  // Ring om de exacte plek. Gewone HTML-laag (geen vectorlaag, die kan onzichtbaar blijven) die met het zoomniveau meeschaalt.
  if (areaRing){ areaRing.remove(); areaRing = null; }
  const R0 = 80, ringIcon = () => { const d = Math.round(2*R0*Math.pow(2, m.getZoom() - r.zoom)); return L.divIcon({ className:'', html:'<div class="areaRing"></div>', iconSize:[d,d], iconAnchor:[d/2,d/2] }); };
  areaRing = L.marker([r.lat, r.lng], { icon: ringIcon(), interactive:false, keyboard:false, zIndexOffset:500 }).addTo(m);
  if (m._ringFix) m.off('zoom zoomend', m._ringFix);
  m._ringFix = () => { if (areaRing) areaRing.setIcon(ringIcon()); }; m.on('zoom zoomend', m._ringFix);
  if (lock){ m.dragging.disable(); m.touchZoom.disable(); m.doubleClickZoom.disable(); m.scrollWheelZoom.disable(); m.boxZoom.disable(); m.keyboard.disable(); }
  else {
    m.dragging.enable(); m.touchZoom.enable(); m.doubleClickZoom.enable(); m.scrollWheelZoom.enable(); m.keyboard.enable();
    m.setMinZoom(r.zoom - 1); m.setMaxZoom(r.zoom + 2);
    m.setMaxBounds([[r.lat - r.pan, r.lng - r.pan*1.5], [r.lat + r.pan, r.lng + r.pan*1.5]]);
  }
  setTimeout(()=>m.invalidateSize(), 50);
}
/* Straatjacht: kaart en scans */
function huntClear(){ if (huntLayer){ huntLayer.remove(); huntLayer = null; } $('#map').classList.remove('hunting'); }
function huntBounds(r){ return L.latLng(r.lat, r.lng).toBounds(r.hunt.rad*2); }
// Het hele speelgebied in beeld, naast of boven het paneel (dat staat liggend opzij).
function huntFit(m, r, animate){
  const W = innerWidth, side = innerHeight <= 500 && W > innerHeight;
  m.fitBounds(huntBounds(r), { animate, paddingTopLeft: side ? [60,6] : [6,70], paddingBottomRight: side ? [Math.min(420, W*.52)+6, 6] : [6, innerHeight < 700 ? 215 : 205] });
}
function showHuntMap(r){
  $('#map').hidden = false; $('#pano').hidden = true;
  const m = ensureMap(), c = L.latLng(r.lat, r.lng), rad = r.hunt.rad;
  if (areaRing){ areaRing.remove(); areaRing = null; }
  m.invalidateSize();
  m.setMinZoom(0); m.setMaxZoom(18); m.setMaxBounds(null);
  m.dragging.enable(); m.touchZoom.enable(); m.scrollWheelZoom.enable(); m.keyboard.enable(); m.boxZoom.disable();
  m.doubleClickZoom.disable();  // dubbeltikken zou twee scans kosten
  huntFit(m, r, false);
  m.setMinZoom(Math.min(m.getZoom(), 15)); m.setMaxBounds(huntBounds(r).pad(3));  // ruim: kleiner dan het beeld trekt de kaart terug onder het paneel
  huntClear();
  huntLayer = L.layerGroup().addTo(m);
  $('#map').classList.add('hunting');
  // Alles buiten het speelgebied donker, zodat duidelijk is waar je moet zoeken.
  const ring = []; for (let i=0; i<72; i++){ const a = i/72*2*Math.PI; ring.push([r.lat + rad*Math.sin(a)/110570, r.lng + rad*Math.cos(a)/(111320*Math.cos(r.lat*Math.PI/180))]); }
  L.polygon([[[r.lat+1,r.lng-2],[r.lat+1,r.lng+2],[r.lat-1,r.lng+2],[r.lat-1,r.lng-2]], ring], { stroke:false, fillColor:'#0a0b1a', fillOpacity:.58, interactive:false }).addTo(huntLayer);
  L.polyline([...ring, ring[0]], { color:'#b9a6ff', weight:2, opacity:.9, dashArray:'6 8', interactive:false }).addTo(huntLayer);
  setTimeout(()=>m.invalidateSize(), 50);
}
function huntReset(r){ HS = { roundId:r.id, left:r.hunt.scans, pin:null, marker:null, log:[], lastD:null, busy:false, circle:null }; }
const HEAT = [[91,140,255],[165,107,255],[255,95,168],[255,165,61]];
function heatColor(x){ const p = Math.max(0, Math.min(.999, x))*(HEAT.length-1), i = Math.floor(p), f = p-i; return 'rgb(' + HEAT[i].map((v,j)=>Math.round(v+(HEAT[i+1][j]-v)*f)).join(',') + ')'; }
const huntBand = d => d < 40 ? 0 : d < 100 ? 1 : d < 250 ? 2 : d < 500 ? 3 : d < 900 ? 4 : 5;
const huntHeat = d => 1 - Math.min(1, Math.log(Math.max(d, 20)/20)/Math.log(75));
function huntPinIcon(){ return L.divIcon({ className:'', html:'<svg class="huntPin" width="30" height="38" viewBox="0 0 30 38"><path d="M15 37S28 24 28 14a13 13 0 1 0-26 0c0 10 13 23 13 23z" fill="#e8552a" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14" r="4.500" fill="#fff"/></svg>', iconSize:[30,38], iconAnchor:[15,37] }); }
// Naam van wat er op deze plek ligt: een gebouw of plek met naam gaat voor, anders de straat.
function huntLabel(j){
  const ad = j.address || {}, road = ad.road || ad.pedestrian || ad.footway || ad.cycleway || ad.path || ad.square || '';
  const own = j.name && !/^(place|boundary|landuse)$/.test(j.category) ? j.name : '';
  return { name: own || road || ad.neighbourhood || ad.quarter || '', road };
}
async function huntTap(ll){
  const r = S.round, h = r.hunt;
  if (!HS || HS.roundId !== r.id || (myAnswer && myAnswer.roundId === r.id) || r.answered.includes(me.id) || HS.busy || sabOutId === r.id) return;
  const lat = R5(ll.lat), lng = R5(ll.lng), roundId = r.id;
  if (metres(lat, lng, r.lat, r.lng) > h.rad){ toast(t('huntOutside')); return; }
  HS.pin = [lat, lng];
  if (HS.marker) HS.marker.setLatLng(ll); else HS.marker = L.marker(ll, { icon:huntPinIcon(), interactive:false, keyboard:false, zIndexOffset:900 }).addTo(huntLayer);
  const sendPin = () => act({ t:'pin', p:{ roundId, pin:HS.pin, scans:h.scans-HS.left } });
  if (HS.left <= 0){ sendPin(); renderHunt(); return; }
  HS.busy = true; renderHunt();
  let j = null;
  try { j = await nomReverse(lat, lng, 18); } catch(e){}
  if (!HS || HS.roundId !== roundId || !S || !S.round || S.round.id !== roundId) return;   // ronde is intussen voorbij
  HS.busy = false;
  if (!j){ toast(t('huntScanFail')); sendPin(); renderHunt(); return; }  // kost geen scan
  HS.left--;
  const { name, road } = huntLabel(j), d = huntClosest(lat, lng, h.g).d, same = x => x && norm(x) === norm(h.n), hit = huntIsHit(h.g, d) || same(name) || same(road);
  const entry = { name, d:Math.round(d), band:huntBand(d), heat:huntHeat(d), dir:bearing8(lat, lng, ...huntClosestArr(lat, lng, h.g)), trend: HS.lastD == null ? null : d < HS.lastD*.97 ? 1 : d > HS.lastD*1.03 ? -1 : 0, hit };
  HS.lastD = d; HS.log.push(entry);
  const color = r.difficulty === 'hard' ? '#fff' : heatColor(entry.heat);
  if (huntLayer){
    if (j.geojson && j.geojson.type !== 'Point') L.geoJSON(j.geojson, { style:{ color, weight:3, opacity:.9, fillColor:color, fillOpacity:.22 }, interactive:false }).addTo(huntLayer);
    const dot = L.marker(ll, { icon:L.divIcon({ className:'', html:`<div class="scanDot" style="--c:${color}"></div>`, iconSize:[16,16], iconAnchor:[8,8] }), interactive:false, keyboard:false }).addTo(huntLayer);
    if (name) dot.bindTooltip(esc(name), { permanent:true, direction:'top', offset:[0,-9], className:'scanTip' });
  }
  beep(r.difficulty === 'hard' ? 520 : 260 + entry.heat*760, .09, 'triangle');
  if (hit && !myAnswer){ toast(t('huntFound')); renderHunt(); huntLock(h.n, true); return; }
  sendPin();
  renderHunt();
}
function huntLock(name, hit){
  const r = S && S.round;
  if (!r || !r.hunt || !HS || myAnswer || sabOutId === r.id) return;
  if (!HS.pin){ toast(t('huntNoPin')); return; }
  myAnswer = { roundId:r.id, code:'pin', pin:HS.pin, scans:r.hunt.scans-HS.left, hintsSeen:r.hints.length, frac:Math.max(0, myRem(r)/r.durationMs), name: name || '', hit: !!hit };
  beep(990,.08);
  act({ t:'answer', p: myAnswer });
  if (S.phase === 'round' && S.round) renderGame();
}
function renderHunt(){
  const r = S.round, h = r.hunt; if (!h || !HS) return;
  $('#huntName').textContent = plain(h.n);

function tick(){
  if (!S) return;
  if (S.phase === 'round' && S.round){
    const r = S.round;
    // rem: de ronde zelf (hints en einde). mine: mijn eigen klok, die met Jetlag sneller loopt.
    const rem = remNow(r), mine = sabRem(r, me.id, rem);
    setTimer(fmtTime(mine)); $('#timerChip').parentElement.classList.toggle('low', mine < 10000);
    $('#timerBar').style.transform = `scaleX(${Math.max(0, Math.min(1, mine / r.durationMs))})`;
    // Jetlag: mijn tijd is om terwijl de ronde doorloopt. Invoer dicht, een pin die er al stond telt nog.
    if (mine <= 0 && rem > 300 && sabOutId !== r.id && !(myAnswer && myAnswer.roundId === r.id) && !r.answered.includes(me.id)){
      sabOutId = r.id; closeAc(); $('#guess').blur(); toast(t('jlOut')); beep(160, .35, 'square', .05); renderGame();
    }
    const elapsed = r.durationMs - rem;
    const nextIdx = r.hints.length;
    if (nextIdx < r.hintTotal){
      const into = elapsed - (nextIdx-1)*r.hintIntervalMs;
      $('#hintBar').style.width = Math.min(100, Math.max(0, into / r.hintIntervalMs * 100)) + '%';
      $('#nextSecs').textContent = Math.max(0, Math.ceil((nextIdx*r.hintIntervalMs - elapsed)/1000)) + 's';
      $('#nextHint').style.display = '';
    } else $('#nextHint').style.display = 'none';
    // Tekenen: de host meldt hoeveel stukjes er zijn. Lopen we achter en komt er niets binnen, dan de hele tekening opvragen.
    if (r.draw && DR && DR.roundId === r.id && (r.drawN || 0) > DR.ops.length && now() - DR.got > CONFIG.draw.syncMs) drawAsk();
  }
  if (S.phase === 'result' && S.result){
    const left = S.result.nextAt - (now()-recvAt);
    $('#resTimer').textContent = S.result.last ? '' : t('nextIn', { s: Math.max(0, Math.ceil(left/1000)) });
    $('#resTimer').style.display = S.result.last ? 'none' : '';
  }
}

    for (const k of s.keys){ const i = k.indexOf(n); if (i===0) best = Math.min(best, 0); else if (i>0) best = Math.min(best, 1); }
    if (best < 99) res.push({ code:s.code, score: best + cname(s.code).length/100 });
  }

}

function submitGuess(code){
  if (!S || S.phase!=='round' || !S.round || S.round.hunt || drawMe(S.round) || myAnswer || sabOutId === S.round.id) return;
  const nl = nlNow();
  if (!code){ const exact = (nl ? CITY_SEARCH : SEARCH).find(s => s.keys.includes(norm($('#guess').value))); code = exact && exact.code; }
  if (!code){ toast(t(nl ? 'unknownNl' : 'unknown')); return; }

}

function drawResultMap(R){
  if (!$('#result').classList.contains('on')) return;
  // Geen scrollwiel: anders blijft de pagina hangen op de kaart.
  if (!rmap){ rmap = L.map('rmap', { zoomControl:false, attributionControl:true, scrollWheelZoom:false }); addTiles(rmap); }
  rmap.invalidateSize();
  rmap.eachLayer(l => { if (!(l instanceof L.TileLayer)) rmap.removeLayer(l); });
  if (resLabels){ resLabels.remove(); resLabels = null; }
  if (R.hunt){
    // Doel oplichten, iedereen zijn pin, en nu wel de straatnamen op de kaart.
    const g = R.hunt.g, lines = g.l ? g.l.map(line => { const p = []; for (let i=0; i<line.length; i+=2) p.push([line[i], line[i+1]]); return p; }) : [];
    const pts = [[R.lat, R.lng], ...lines.flat()], rows = R.rows.filter(row => row.pin);
    rows.forEach(row => pts.push(row.pin));
    rmap.fitBounds(pts, { padding:[34,34], maxZoom:17, animate:false });
    resLabels = esriCanvas('Dark', 'Reference').addTo(rmap);
    for (const row of rows){
      const p = playerById(row.id), color = p ? p.color : '#888', near = huntClosestArr(row.pin[0], row.pin[1], g);
      L.polyline([row.pin, near], { color, weight:2, dashArray:'4 6' }).addTo(rmap);
      L.circleMarker(row.pin, { radius:7, color:'#fff', weight:2, fillColor:color, fillOpacity:1 }).bindTooltip(esc(p ? p.name : '?') + ': ' + row.dist + ' m', { permanent:rows.length < 4, direction:'top', offset:[0,-8], className:'scanTip' }).addTo(rmap);
    }
    for (const line of lines){ L.polyline(line, { color:'#0e0e0c', weight:8, opacity:.55 }).addTo(rmap); L.polyline(line, { color:'#ffb48f', weight:4 }).addTo(rmap); }
    L.circleMarker([R.lat, R.lng], { radius:8, color:'#fff', weight:3, fillColor:'#e8552a', fillOpacity:1 }).addTo(rmap);
    return;
  }
  if (R.darts){
    // Dartbord rond de plek (ringen als banden, zodat de vulling niet optelt), het land, en ieders pijltje.
    const KM = R.dkm || CONFIG.darts.km, rows = R.rows.filter(row => row.pin);   // ringen geschaald naar het continent
    const rings = KM.map(km => ({ km, pts: geoCircle(R.lat, R.lng, km) })).filter(x => Math.abs(R.lat) + x.km/111.2 < 89);
    const darts = rows.map(row => ({ row, ll: [row.pin[0], nearLng(row.pin[1], R.lng)] }));
    // In beeld: de ring van het verste pijltje helemaal (minstens de binnenring), plus pijltjes die naast het bord liggen.
    const far = Math.min(KM.length - 1, Math.max(1, ...darts.map(d => d.row.ring)));
    const fit = L.latLngBounds(geoCircle(R.lat, R.lng, KM[far], 24));
    darts.forEach(d => fit.extend(d.ll));
    rmap.fitBounds(fit, { padding:[24,24], maxZoom:7, animate:false });
    const g = GEO[R.code];
    if (g) L.geoJSON(g.feature, { style:{ color:'#fff', weight:1.5, opacity:.75, fill:false }, interactive:false }).addTo(rmap);
    const FILL = ['#e8552a', '#2f9a5a', '#f2eee5', '#151513', '#f2eee5'], OP = [.45, .35, .18, .28, .18];
    rings.forEach((x, i) => L.polygon(i ? [x.pts, rings[i-1].pts] : x.pts, { color:'#fff', weight:1, opacity:.75, fillColor:FILL[i], fillOpacity:OP[i], interactive:false }).addTo(rmap));
    resLabels = esriCanvas('Dark', 'Reference').addTo(rmap);
    for (const { row, ll } of darts){
      const p = playerById(row.id), color = p ? p.color : '#888';
      L.polyline([ll, [R.lat, R.lng]], { color, weight:2, dashArray:'4 6', interactive:false }).addTo(rmap);
      L.marker(ll, { icon:dartIcon(color), keyboard:false, zIndexOffset:500 }).bindTooltip(esc(p ? p.name : '?') + ': ' + row.dist.toLocaleString(lang === 'nl' ? 'nl-NL' : 'en-GB') + ' km', { permanent:darts.length < 4, direction:'top', className:'scanTip' }).addTo(rmap);
    }
    L.circleMarker([R.lat, R.lng], { radius:6, color:'#15151f', weight:2.5, fillColor:'#fff', fillOpacity:1 }).addTo(rmap);
    return;
  }
  if (CITIES[R.code]){
    // Nederland: het juiste punt, plus de gok van elke speler met een lijn ernaartoe
    const pts = [[R.lat, R.lng]];
    rmap.fitBounds([[R.lat-.02, R.lng-.03], [R.lat+.02, R.lng+.03]], { animate:false });
    for (const row of R.rows){
      const g = row.guess && CITIES[row.guess], p = playerById(row.id);
      if (!g || row.guess === R.code) continue;
      pts.push([g.lat, g.lng]);
      L.polyline([[R.lat, R.lng], [g.lat, g.lng]], { color: p ? p.color : '#888', weight:2, dashArray:'4 6' }).addTo(rmap);
      L.circleMarker([g.lat, g.lng], { radius:6, color:'#fff', weight:2, fillColor: p ? p.color : '#888', fillOpacity:1 }).bindTooltip(esc(p ? p.name : '?') + ': ' + esc(g.name)).addTo(rmap);
    }
    L.circleMarker([R.lat, R.lng], { radius:8, color:'#fff', weight:3, fillColor:'#e8552a', fillOpacity:1 }).addTo(rmap);
    rmap.fitBounds(pts, { padding:[30,30], maxZoom:13, animate:false });
    return;
  }
  const g = GEO[R.code];
  // eerst view zetten (Leaflet heeft een view nodig voor vectorlagen)
  const poly = g.polys.find(p => inPoly(R.lng, R.lat, p)) || g.polys.reduce((a,b)=>a.area>b.area?a:b);
  const [a,b,c,d] = poly.bbox;
  rmap.fitBounds([[b,a],[d,c]], { padding:[20,20], maxZoom:7, animate:false });
  L.geoJSON(g.feature, { style: { color:'#fff', weight:2.5, fillColor:'#e8552a', fillOpacity:.3 } }).addTo(rmap);
  if (!R.shape && !R.draw && !R.trace) L.circleMarker([R.lat, R.lng], { radius:8, color:'#fff', weight:3, fillColor:'#e8552a', fillOpacity:1 }).addTo(rmap);
}

  const sabTiles = cardsPlayed ? [

    [t('sabTotal'), String(cardsPlayed), t('sabPlayed')],
  ] : [];
  $('#finStats').innerHTML = [
    [t('bestRound'), best && P(best.id).name, best && best.best+' pt'],
    [t('fastest'), fast ? P(fast.id).name : '-', fast ? (fast.fastest/1000).toFixed(1)+'s' : ''],
    [t('mostCorrect'), most && P(most.id).name, most && most.correct+'x'],

function receiveChat(m, peerId){
  if (!m) return;
  const who = { name: String(m.name||'?').slice(0,16), color: okColor(m.color, '#888888'), avatar: avKey(m.avatar) };
  if (m.emote !== undefined){
    // Alleen bekende emotes, en per speler maximaal één per 0,7 s, zodat niemand het scherm kan volspammen.
    if (typeof m.emote !== 'string' || !Object.prototype.hasOwnProperty.call(EMOTES, m.emote)) return;
    const k = peerId || who.name, now = Date.now(); if (now - (emoSeen[k] || 0) < 700) return; emoSeen[k] = now;
    addChat({ ...who, emote: m.emote, mine:false }); showEmote(who, m.emote); return;
  }
  if (typeof m.text !== 'string' || !m.text.trim()) return;
  addChat({ ...who, text: m.text.slice(0,500), mine:false });
}

const EMO_SFX = { hit:[[660,0],[990,90]], lost:[[330,0],[294,120],[349,240]], hurry:[[880,0],[880,150],[880,300]], splash:[[220,0],[165,70]], king:[[523,0],[659,90],[784,180],[1047,270]] };
const EMO_COOLDOWN = 1500, emoSeen = {};
let emoLast = 0;
const emoOpen = () => $('#emoTray').classList.contains('on');
function closeEmoTray(){ $('#emoTray').classList.remove('on'); $('#emoBtn').classList.remove('on'); $('#emoBtn').setAttribute('aria-expanded', 'false'); }
function renderEmoBar(){
  const html = Object.keys(EMOTES).map(id => `<button class="emob" data-e="${id}" title="${esc(t('em_'+id))}" aria-label="${esc(t('em_'+id))}"><span class="emo">${EMOTES[id]}</span></button>`).join('');
  $('#emoTray').innerHTML = html; $('#emoStrip').innerHTML = html;
}
// Anderen zien de sticker met jouw naam en kleur. Zelf zie je hem in de chat en de knoppen rusten even.
function sendEmote(id){
  if (!sendChat || !Object.prototype.hasOwnProperty.call(EMOTES, id)) return;
  const now = Date.now(); if (now - emoLast < EMO_COOLDOWN) return; emoLast = now;
  sendChat({ name: me.name, color: me.color, avatar: me.avatar, emote: id });
  addChat({ name: me.name, color: me.color, emote: id, mine:true });
  closeEmoTray(); beep(740, .04);
  document.querySelectorAll('.emob').forEach(b => b.classList.add('cool'));
  setTimeout(() => document.querySelectorAll('.emob').forEach(b => b.classList.remove('cool')), EMO_COOLDOWN);
}
function showEmote(who, id){
  const layer = $('#emoLayer');
  while (layer.children.length >= 3) layer.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'emo-pop'; el.style.setProperty('--c', who.color);
  el.innerHTML = `<div class="emo play">${EMOTES[id]}</div><div class="emo-txt"><span class="emo-who">${avaHtml(who, 'xs')}<b>${esc(who.name)}</b></span><span class="emo-lbl">${esc(t('em_'+id))}</span></div>`;
  layer.appendChild(el);
  (EMO_SFX[id] || []).forEach(([f, d]) => setTimeout(() => beep(f, .09, id === 'splash' ? 'triangle' : 'sine', .07), d));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 3400);
}
$('#emoBtn').addEventListener('click', () => {
  const open = !emoOpen(); $('#chat').classList.remove('on'); closeSabTray();
  $('#emoTray').classList.toggle('on', open); $('#emoBtn').classList.toggle('on', open); $('#emoBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => { const b = e.target.closest('.emob'); if (b) sendEmote(b.dataset.e); });
document.addEventListener('pointerdown', e => { if (emoOpen() && !e.target.closest('#emoTray,#emoBtn')) closeEmoTray(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEmoTray(); });

/* ================= SABOTAGE (scherm) =================
   Kaarten, je hand, de uitleg met de speelknop en de meldingen. De regels zelf staan bij de host (SABOTAGE hierboven).
   De tekening op een kaart is inline SVG van 64 x 64. Bewegende delen hebben een klasse (.sa-*): de animatie staat in de CSS en loopt bij .play of hover. */
const SAB_PLANE = 'M22 12c0 1-1.3 1.6-2.8 1.6h-4.1l-4.3 6.9H8.5l2.2-6.9H6.3l-1.8 2.4H2.7l1-4-1-4h1.8l1.8 2.4h4.4L8.5 3.5h2.3l4.3 6.9h4.1C20.7 10.4 22 11 22 12z';
const SAB_ART = {
  // Blackout: de maan schuift voor de wereld, alleen de gloed blijft over
  bo: `<svg class="art" viewBox="0 0 64 64" aria-hidden="true"><g class="sa-rays" fill="none" stroke="var(--ka)" stroke-width="2.6" stroke-linecap="round"><path d="M32 5v6M32 53v6M5 32h6M53 32h6M12.9 12.9l4.2 4.2M46.9 46.9l4.2 4.2M12.9 51.1l4.2-4.2M46.9 17.1l4.2-4.2"/></g>
    <circle cx="32" cy="32" r="15.5" fill="#e8552a"/><g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"><path d="M16.5 32h31"/><ellipse cx="32" cy="32" rx="7" ry="15.5"/></g>
    <circle class="sa-moon" cx="32" cy="32" r="13.6" fill="#08070b"/></svg>`,
  // Delusion: een spiraal die blijft draaien
  de: `<svg class="art" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="23" fill="#fff" fill-opacity=".1"/>
    <path class="sa-spin" fill="none" stroke="var(--ka)" stroke-width="3.6" stroke-linecap="round" d="M33.5 32.0Q33.8 32.7 33.7 33.2Q33.6 33.6 33.3 34.1Q33.0 34.5 32.5 34.8Q32.0 35.1 31.3 35.2Q30.7 35.2 30.0 35.0Q29.3 34.7 28.6 34.2Q28.0 33.6 27.7 32.8Q27.3 32.0 27.3 31.0Q27.3 30.1 27.7 29.1Q28.1 28.1 28.9 27.3Q29.8 26.6 30.9 26.1Q32.0 25.7 33.3 25.8Q34.6 25.8 35.8 26.4Q37.0 27.0 37.9 28.1Q38.9 29.1 39.4 30.6Q39.9 32.0 39.7 33.6Q39.6 35.2 38.9 36.6Q38.1 38.1 36.8 39.2Q35.5 40.4 33.7 40.9Q32.0 41.5 30.1 41.3Q28.2 41.1 26.5 40.2Q24.8 39.2 23.5 37.7Q22.2 36.1 21.6 34.0Q21.0 32.0 21.2 29.8Q21.4 27.6 22.5 25.6Q23.6 23.6 25.5 22.2Q27.3 20.7 29.7 20.0Q32.0 19.4 34.5 19.7Q37.0 20.0 39.2 21.2Q41.5 22.5 43.1 24.6Q44.8 26.7 45.5 29.4Q46.2 32.0 45.9 34.8Q45.5 37.6 44.1 40.1Q42.6 42.6 40.3 44.4Q37.9 46.2 35.0 47.0Q32.0 47.8 28.9 47.4Q25.8 47.0 23.0 45.4Q20.3 43.7 18.3 41.1Q16.3 38.5 15.4 35.3Q14.6 32.0 15.1 28.6Q15.5 25.2 17.3 22.2Q19.1 19.1 22.0 17.0Q24.9 14.8 28.4 13.9L32.0 13.0"/>
    <path class="sa-tw" fill="#fff" d="M53 8l1.3 3.2 3.2 1.3-3.2 1.3L53 17l-1.3-3.2-3.2-1.3 3.2-1.3z"/><path class="sa-tw two" fill="#fff" d="M10 47l1 2.5 2.5 1-2.5 1L10 54l-1-2.5-2.5-1 2.5-1z"/></svg>`,
  // Jetlag: de wijzers jagen rond en er komt een vliegtuig over
  jl: `<svg class="art" viewBox="0 0 64 64" aria-hidden="true"><circle cx="29" cy="36" r="18" fill="#fff"/><circle cx="29" cy="36" r="18" fill="none" stroke="#08323d" stroke-opacity=".35" stroke-width="2.5"/>
    <path d="M29 21.5v3M29 47.5v3M14.5 36h3M40.5 36h3" fill="none" stroke="#0b5c70" stroke-width="2.2" stroke-linecap="round"/>
    <path class="sa-hh" d="M29 36v-8" fill="none" stroke="#08323d" stroke-width="3.2" stroke-linecap="round"/><path class="sa-hm" d="M29 36h11.5" fill="none" stroke="#e8552a" stroke-width="2.6" stroke-linecap="round"/>

};
// Variant: dobbelsteen (willekeurig), vizier (kies), groepje (iedereen)
const SAB_VAR_ICON = {
  r: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8.5" cy="8.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="15.5" cy="15.5" r="1.7"/></svg>',
  c: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2v4.5M12 17.5V22M2 12h4.5M17.5 12H22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.8"/></svg>',
  a: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.8" r="3.6"/><circle cx="6" cy="16.8" r="3.6"/><circle cx="18" cy="16.8" r="3.6"/></svg>',
};
// Een kaart als HTML. Met n (de plek in je hand) is het een knop.
function sabCard(card, cls = '', n = null){
  const k = sabType(card), v = sabVar(card), nm = t('sab_' + k) + ', ' + t('sabv_' + v), tag = n == null ? 'span' : 'button';
  return `<${tag} class="sc ${cls}" data-k="${k}" data-v="${v}"${n == null ? '' : ` type="button" data-n="${n}" aria-label="${esc(nm)}" title="${esc(nm)}"`}>${SAB_ART[k]}<span class="sc-nm">${esc(t('sab_' + k))}</span><span class="sc-v">${SAB_VAR_ICON[v]}</span></${tag}>`;
}
const sabOpen = () => $('#sabTray').classList.contains('on');
function closeSabTray(){ sabSel = -1; $('#sabTray').classList.remove('on'); document.querySelectorAll('#sabHand .sc.sel').forEach(b => b.classList.remove('sel')); }
// Kan deze kaart nu gespeeld worden, en op wie? Zelfde regels als de host (sabPlay), zodat de knop niets belooft wat niet kan.
function sabState(card){
  const mine = playerById(me.id), r = S.round, k = sabType(card);
  if (!mine || S.finding || (S.phase !== 'round' && S.phase !== 'result')) return { why:'sabNotNow' };
  if (mine.played === S.roundN) return { why:'sabUsed' };
  const direct = S.phase === 'round' && k !== 'de';
  if (!direct && S.roundN >= roundsOf(S.settings)) return { why:'sabNoNext' };
  const rem = r ? remNow(r) : 0, pool = S.players.filter(p => sabCanHit(r, p, me.id, direct, x => r.answered.includes(x.id) || sabRem(r, x.id, rem) <= 0));
  return pool.length ? { ok:true, direct, pool } : { why:'sabNoTarget' };
}
// Uitleg van de gekozen kaart, wanneer hij werkt en de knop om hem te spelen (bij "kies": de spelers die je kunt raken).
function renderSabTray(){
  const mine = S && playerById(me.id), card = mine && (mine.cards || [])[sabSel], el = $('#sabTray');
  if (!card){ closeSabTray(); return; }
  const k = sabType(card), v = sabVar(card), st = sabState(card);
  const html = `<div class="st-top">${sabCard(card, 'play')}<div class="st-txt"><b>${esc(t('sab_' + k))}</b><span class="st-var">${SAB_VAR_ICON[v]}${esc(t('sabv_' + v))}</span><p>${esc(t('sabd_' + k) + ' ' + t('sabw_' + v))}</p></div></div>`
    + `<div class="st-when${st.ok ? '' : ' no'}">${esc(t(st.ok ? (st.direct ? 'sabNow' : 'sabNext') : st.why))}</div>`
    + (!st.ok ? '' : v === 'c' ? `<div class="st-pick">${st.pool.map(p => `<button class="st-p" type="button" data-to="${esc(p.id)}">${avaHtml(p, 'xs')}<span>${esc(p.name)}</span></button>`).join('')}</div>`
      : `<button class="btn pri st-go" type="button" data-to="">${esc(t(v === 'a' ? 'sabPlayAll' : 'sabPlayRnd'))}</button>`);
  if (el.dataset.h !== html){ el.dataset.h = html; el.innerHTML = html; }   // alleen bij verandering: anders begint de tekening steeds opnieuw
}
// Hand en uitleg bijwerken. Loopt na elke render en bij het verlaten van een kamer.
function sabUi(){
  const hand = $('#sabHand'), mine = S && S.players.find(p => p.id === me.id);
  const live = !!(mine && sabOn(S.settings) && (S.phase === 'round' || S.phase === 'result') && S.players.filter(p => p.connected).length > 1);
  const cards = live ? mine.cards || [] : [], used = live && mine.played === S.roundN, sig = cards.join() + lang;
  if (hand.dataset.sig !== sig){
    const grew = cards.length > (+hand.dataset.n || 0);
    hand.dataset.sig = sig; hand.dataset.n = cards.length;
    hand.innerHTML = cards.map((c, i) => sabCard(c, 'tiny' + (grew && i === cards.length - 1 ? ' new' : ''), i)).join('');
  }
  hand.classList.toggle('show', cards.length > 0); hand.classList.toggle('used', used);
  if (sabSel >= cards.length) closeSabTray();
  hand.querySelectorAll('.sc').forEach((b, i) => b.classList.toggle('sel', i === sabSel));
  if (sabOpen()) renderSabTray();
}
// Melding in de laag van de emotes: de tekening van de kaart, een titel en een regel eronder.
function sabPop(k, title, lineHtml, sub, sfx){
  const layer = $('#emoLayer');
  while (layer.children.length >= 3) layer.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'sab-pop'; el.dataset.k = k;
  el.innerHTML = `<span class="sc play" data-k="${k}">${SAB_ART[k]}</span><div class="sp-t"><b>${esc(title)}</b><span>${lineHtml}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  layer.appendChild(el);
  (sfx || []).forEach(([f, d]) => setTimeout(() => beep(f, .1, 'triangle', .07), d));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 3600);
}
// Iemand speelde een kaart. Delusion ziet alleen wie hem speelde: voor de rest blijft het geheim tot de uitslag.
function sabAnnounce(e){
  const k = sabType(e.card), v = sabVar(e.card);
  if (!SAB_TYPES.includes(k) || !Array.isArray(e.to) || (k === 'de' && e.by !== me.id)) return;
  const hitNow = e.direct && e.to.includes(me.id);
  if (hitNow && k === 'bo') return;   // het zwarte scherm zegt zelf al wie het deed
  const by = playerById(e.by) || { name:'?', color:'#888' }, to = e.to.map(id => playerById(id)).filter(Boolean);
  const names = v === 'a' && to.length > 1 ? esc(t('sabAll')) : to.map(p => dotHtml(p) + esc(p.name)).join(', ');
  sabPop(k, t('sab_' + k), `${dotHtml(by)}${esc(by.name)}<svg class="ic" aria-hidden="true"><use href="#i-next"/></svg>${names}`, k === 'de' ? t('sabSecret') : e.direct ? '' : t('sabNextShort'),
    k === 'bo' ? [[330,0],[220,110],[147,220]] : k === 'jl' ? [[494,0],[659,80],[880,160]] : [[523,0],[494,140],[415,280]]);
  if (hitNow && k === 'jl'){ const c = $('#timerChip').parentElement; c.classList.remove('zap'); void c.offsetWidth; c.classList.add('zap'); }
}
// Nieuwe meldingen en nieuwe kaarten uit een snapshot halen. Bij binnenkomst (of terugkomst) wordt niets nagespeeld.
function sabNews(prev, snap){
  const evs = snap.ev || [], top = evs.reduce((a, e) => Math.max(a, e.id), 0);
  if (!prev){ sabSeen = top; return; }
  for (const e of evs) if (e.id > sabSeen) sabAnnounce(e);
  sabSeen = Math.max(sabSeen, top);
  const a = prev.players.find(p => p.id === me.id), b = snap.players.find(p => p.id === me.id);
  if (a && b && b.cards && b.cards.length > (a.cards || []).length){ const c = b.cards[b.cards.length - 1]; sabPop(sabType(c), t('sabNew'), esc(t('sab_' + sabType(c)) + ', ' + t('sabv_' + sabVar(c))), '', [[880,0],[1175,90]]); }
}
$('#sabHand').addEventListener('click', e => {
  const b = e.target.closest('[data-n]'); if (!b) return;
  const n = +b.dataset.n, same = sabOpen() && sabSel === n;
  closeEmoTray(); $('#chat').classList.remove('on');
  if (same){ closeSabTray(); return; }
  sabSel = n; $('#sabTray').classList.add('on'); beep(560, .04); sabUi();
});
$('#sabTray').addEventListener('click', e => {
  const b = e.target.closest('[data-to]'), mine = S && playerById(me.id), card = mine && (mine.cards || [])[sabSel];
  if (!b || !card) return;
  act({ t:'card', p:{ card, to: b.dataset.to || null } });
  closeSabTray(); beep(700, .06);
});
$('#sabDeck').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b){ toast(t('sabd_' + b.dataset.k)); beep(560, .04); } });
document.addEventListener('pointerdown', e => { if (sabOpen() && !e.target.closest('#sabTray,#sabHand')) closeSabTray(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sabOpen()) closeSabTray(); });

/* ================= BOOT ================= */
(async function boot(){
  $('#name').value = me.name; renderColors(); applyI18n(); show('start');
  try { await loadData(); } catch(e){ overlay(t('dataFail')); return; }
  joinFromHash();
  window.addEventListener('hashchange', joinFromHash);
})();
</script>
