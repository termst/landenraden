<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2ede2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23c2432b%22/%3E%3C/svg%3E">
<title>Landenraden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f2ede2;--card:#fbf8f1;--card2:#efe9db;--line:#d8cfbb;--ink:#1b2428;--mute:#6a7276;
  --acc:#c2432b;--acc-d:#a43520;--sea:#1f5868;--gold:#b9801a;--bad:#b3261e;--ok:#2d7a4d;--r:12px;
  --serif:'Fraunces',Georgia,serif;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
  --shadow:0 1px 0 rgba(27,36,40,.06),0 6px 18px -8px rgba(27,36,40,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--serif);font-size:46px;line-height:1;margin:0;font-weight:600;letter-spacing:-1.2px;font-variation-settings:'opsz' 120}
h1 em{font-style:italic;color:var(--acc);font-weight:500}
h2{font-family:var(--serif);font-size:21px;margin:0;font-weight:600;letter-spacing:-.3px}
.sub{color:var(--mute);margin:0;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.eyebrow,label{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
input[type=text]{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(31,88,104,.15)}
.btn{border:1.5px solid var(--ink);border-radius:10px;padding:13px 16px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink);transition:transform .08s,background .15s,box-shadow .15s;box-shadow:0 2px 0 var(--ink)}
.btn:hover{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc-d);color:#fff;box-shadow:0 2px 0 var(--acc-d)}
.btn.pri:hover{background:var(--acc-d)}
.btn.pri:active{box-shadow:0 0 0 var(--acc-d)}
.btn.sec{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink);background:var(--card)}
.btn.sec:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--ink);background:#fff}
/* start */
.hero{display:flex;align-items:center;gap:16px;margin-top:6px}
.globe{width:76px;height:76px;flex:none;cursor:pointer;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.globe:hover{transform:rotate(20deg) scale(1.06)}
.globe circle{fill:var(--card);stroke:var(--ink);stroke-width:2}
.globe .g{fill:none;stroke:var(--sea);stroke-width:1.5;opacity:.75}
.globe .m{transform-origin:50px 50px;animation:turn 6s linear infinite}
.globe .m:nth-of-type(2){animation-delay:-2s}.globe .m:nth-of-type(3){animation-delay:-4s}
@keyframes turn{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:21px;color:#fff;transition:background .2s,transform .2s}
.avatar.bump{transform:scale(1.15)}
.nameRow{display:flex;gap:12px;align-items:center}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;flex:none;transition:transform .15s,box-shadow .15s}
.colors button:hover{transform:scale(1.12)}
.colors button.on{box-shadow:0 0 0 2.5px var(--ink)}
.divider{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
/* lobby */
.code{font-family:var(--mono);font-size:46px;font-weight:500;letter-spacing:10px;text-align:center;padding-left:10px}
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:9px 12px;animation:pop .3s ease}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pl .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--paper);letter-spacing:.04em;text-transform:uppercase}
.badge.off{background:var(--line);color:var(--mute)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:20px;padding:0 4px;line-height:1}
.x:hover{color:var(--bad)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,36,40,.18)}
.seg.ro button{pointer-events:none}
.seg.sm button{font-size:12px;padding:8px 1px}
.field{display:flex;flex-direction:column;gap:7px}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--sea)}.sw.on::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipbtn{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mute);transition:all .15s}
.chipbtn:hover{border-color:var(--ink);color:var(--ink)}
.chipbtn.on{background:var(--sea);border-color:var(--sea);color:#fff}
.chips.ro .chipbtn{pointer-events:none}
.note{font-size:12.5px;color:var(--mute);margin:-4px 0 0}
/* game */
#game{padding:0}
#map{position:absolute;inset:0;background:#1c2b30}
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;z-index:500;pointer-events:none;align-items:stretch}
.hud>*{pointer-events:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;box-shadow:var(--shadow)}
.chip small{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chip b{font-family:var(--mono);font-weight:500;font-size:17px}
.chip.timer{min-width:84px;align-items:center;position:relative;overflow:hidden}
.chip.timer.low b{color:var(--bad);animation:throb 1s infinite}
@keyframes throb{50%{opacity:.45}}
.tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--sea);width:100%;transform-origin:left;transition:background .3s}
.chip.timer.low .tbar{background:var(--bad)}
.grow{flex:1}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin:auto}
.netdot.mid{background:var(--gold)}.netdot.bad{background:var(--bad)}
.mapctl{position:absolute;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 62px);z-index:500;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:600;cursor:pointer;line-height:1;transition:background .15s,transform .1s}
.mapctl button:hover{background:#fff}.mapctl button:active{transform:scale(.92)}
.mapctl.off{display:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:500;padding:10px 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:580px;margin:0 auto}
.hints{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.hhead{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;cursor:pointer;user-select:none}
.hhead .eyebrow{flex:1}
.hhead .eyebrow b{color:var(--ink);font-family:var(--mono);font-weight:500;margin-left:6px}
.mini{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,opacity .15s}
.mini:hover{background:var(--ink);color:var(--paper)}
.mini:disabled{opacity:.35;pointer-events:none}
.mini.voted{background:var(--sea);border-color:var(--sea);color:#fff;pointer-events:none}
.chev{width:26px;text-align:center;color:var(--mute);transition:transform .2s;font-size:13px}
.hints.shut .chev{transform:rotate(180deg)}
.hints.shut #hintList,.hints.shut .next{display:none}
#hintList{max-height:30vh;overflow-y:auto;border-top:1px solid var(--line)}
.hint{display:flex;gap:12px;align-items:baseline;padding:9px 14px;font-size:15.5px;border-bottom:1px solid var(--line);animation:slide .4s cubic-bezier(.2,.9,.3,1)}
.hint:last-child{border-bottom:0}
.hint.new{background:#fff5d6;animation:slide .4s cubic-bezier(.2,.9,.3,1),flash 2.2s ease forwards}
@keyframes flash{to{background:transparent}}
.hint b{font-family:var(--mono);font-weight:500;font-size:12px;flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;align-self:center}
.hint .k{color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;flex:none;min-width:84px}
.hint .v{font-family:var(--serif);font-weight:500;font-size:16.5px;line-height:1.3}
.hint .v img{height:34px;border-radius:3px;box-shadow:0 0 0 1px var(--line);vertical-align:middle}
.next{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);background:var(--card2)}
.next b{font-family:var(--mono);font-weight:500;color:var(--ink);min-width:24px;text-align:right}
.bar{height:4px;background:var(--line);border-radius:4px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.answer{position:relative;display:flex;gap:8px}
.answer input{box-shadow:var(--shadow);border-color:var(--ink)}
.answer .btn{flex:none}
.ac{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--card);border:1px solid var(--ink);border-radius:10px;overflow:hidden;display:none;box-shadow:var(--shadow)}
.ac.on{display:block}
.ac div{padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.ac div img{width:24px;height:18px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.ac div.sel,.ac div:hover{background:var(--card2)}
.ac mark{background:none;font-weight:700;color:var(--acc)}
.locked{background:var(--ink);color:var(--paper);border-radius:10px;padding:13px 14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:pop .25s ease}
.locked img{height:18px;border-radius:2px}
.locked span{margin-left:auto;font-size:12px;opacity:.65;font-weight:500}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);transition:all .2s}
.who span.done{border-color:var(--ok);background:#e5f1e8}
.who span.off{opacity:.45}
/* result */
#rmap{height:36vh;min-height:220px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);flex:none}
.answerbig{display:flex;align-items:center;gap:14px}
.answerbig img{height:44px;border-radius:4px;box-shadow:0 0 0 1px var(--line);animation:pop .4s ease}
.answerbig .nm{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mute);font-weight:700;text-align:left;padding:6px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
td{padding:10px 4px;border-top:1px solid var(--line)}
td.n{text-align:right;font-family:var(--mono)}
td img{height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
tbody tr{animation:slide .4s ease backwards}
.good{color:var(--ok)}.half{color:var(--gold)}.miss{color:var(--bad)}
.plus{font-family:var(--mono);font-weight:500}
/* final */
.podium{display:flex;align-items:flex-end;gap:10px;height:210px;margin-top:6px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--serif);font-weight:600;font-size:26px;color:#fff;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.pod .pn{font-weight:700;font-size:14px;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.pod .ps{font-family:var(--mono);font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:3px}
.stat small{color:var(--mute);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.stat b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat i{font-style:normal;font-size:12px;color:var(--mute);font-family:var(--mono)}
/* overlay */
.ov{position:fixed;inset:0;z-index:2000;background:rgba(27,36,40,.55);display:none;align-items:center;justify-content:center;padding:24px}
.ov.on{display:flex;animation:fade .2s}
.ov .card{max-width:420px;width:100%;text-align:center;align-items:center;box-shadow:var(--shadow)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal .card{text-align:left;align-items:stretch;max-height:85vh;overflow-y:auto}
.modal p,.modal li{color:#3a454a;line-height:1.5;margin:0}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(calc(-100% - 40px));z-index:3000;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600;transition:transform .3s;white-space:nowrap;box-shadow:var(--shadow)}
.toast.on{transform:translateX(-50%) translateY(0)}
.leaflet-container{font-family:var(--font);background:#1c2b30}
.leaflet-control-attribution{font-size:9px!important;background:rgba(251,248,241,.8)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--mute)!important}
.footer{color:var(--mute);font-size:12.5px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- START -->
<section class="screen" id="start">
  <div class="wrap">
    <div class="topbar">
      <span class="pill" id="langBtn">NL / EN</span>
      <span class="row" style="flex:none;gap:8px">
        <span class="pill" id="soundBtn"></span>
        <span class="pill" id="rulesBtn" data-i="rules"></span>
      </span>
    </div>
    <div class="hero">
      <svg class="globe" id="globe" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="45"/>
        <ellipse class="g m" cx="50" cy="50" rx="45" ry="45"/><ellipse class="g m" cx="50" cy="50" rx="45" ry="45"/><ellipse class="g m" cx="50" cy="50" rx="45" ry="45"/>
        <line class="g" x1="5" y1="50" x2="95" y2="50"/><path class="g" d="M10 30 Q50 38 90 30"/><path class="g" d="M10 70 Q50 62 90 70"/>
      </svg>
      <div><h1>Landen<em>raden</em></h1></div>
    </div>
    <p class="sub" data-i="tagline"></p>
    <div class="card">
      <div class="field"><label data-i="yourName" for="name"></label>
        <div class="nameRow"><div class="avatar" id="avatar"></div><input type="text" id="name" maxlength="16" autocomplete="off"></div></div>
      <div class="field"><label data-i="yourColor"></label><div class="colors" id="colors"></div></div>
    </div>
    <div class="card">
      <button class="btn pri" id="createBtn" data-i="create"></button>
      <div class="row"><input type="text" id="codeIn" maxlength="4" style="text-transform:uppercase;font-family:var(--mono);letter-spacing:5px;text-align:center" placeholder="ABCD" autocomplete="off"><button class="btn" id="joinBtn" data-i="join" style="flex:none;min-width:110px"></button></div>
      <div class="divider">·</div>
      <button class="btn sec" id="soloBtn" data-i="solo"></button>
      <p class="err" id="startErr"></p>
    </div>
    <p class="footer" data-i="footer"></p>
  </div>
</section>

<!-- LOBBY -->
<section class="screen" id="lobby">
  <div class="wrap">
    <div class="topbar"><span class="pill" id="leaveBtn" data-i="leave"></span><span class="pill" id="rulesBtn2" data-i="rules"></span></div>
    <div class="card" style="align-items:center;gap:8px">
      <label data-i="roomCode"></label>
      <div class="code" id="lobbyCode">----</div>
      <div class="row" style="width:100%;margin-top:6px"><button class="btn sec" id="copyBtn" data-i="copyCode"></button><button class="btn sec" id="shareBtn" data-i="share"></button></div>
    </div>
    <div class="card">
      <div class="topbar"><h2 data-i="players"></h2><span class="sub" id="pCount"></span></div>
      <div class="players" id="lobbyPlayers"></div>
    </div>
    <div class="card" id="settingsCard">
      <h2 data-i="settings"></h2>
      <div class="field"><label data-i="rounds"></label><div class="seg" data-set="rounds" data-opts="5,10,15"></div></div>
      <div class="field"><label data-i="roundTime"></label><div class="seg" data-set="roundTime" data-opts="30,60,90" data-suf="s"></div></div>
      <div class="field"><label data-i="difficulty"></label><div class="seg" data-set="difficulty" data-opts="easy,normal,hard"></div></div>
      <div class="field"><label data-i="continent"></label><div class="seg sm" data-set="continent" data-opts="ALL,EU,AF,AS,AM,OC"></div></div>
      <div class="field"><label data-i="weighting"></label><div class="seg" data-set="weighting" data-opts="uniform,area"></div></div>
      <div class="toggle"><label data-i="smallCountries"></label><button class="sw" data-sw="small" aria-label="toggle"></button></div>
    </div>
    <div class="card" id="hintCard">
      <h2 data-i="hintSettings"></h2>
      <div class="field"><label data-i="hintCount"></label><div class="seg" data-set="hintCount" data-opts="4,6,8"></div></div>

  CODES = {}; CURCOUNT = {};

function beep(f=660, d=.08, type='sine', vol=.08){
  if (!sound) return;

    o.type=type; o.frequency.value=f; g.gain.value=vol; o.connect(g); g.connect(actx.destination);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d); o.start(); o.stop(actx.currentTime+d); } catch(e){}
}

/* ================= DATA ================= */
let COUNTRIES = {}, GEO = {}, SEARCH = [];
async function loadData(){
  overlay(t('loading'));
  const [c, g] = await Promise.all([fetch('data/countries.json').then(r=>r.json()), fetch('data/countries.geojson').then(r=>r.json())]);
  COUNTRIES = c; buildCurrencies();
  for (const f of g.features){
    const polys = f.geometry.coordinates.map(rings => {
      const outer = rings[0]; let minX=180,minY=90,maxX=-180,maxY=-90, a=0;
      for (let i=0;i<outer.length;i++){ const [x,y]=outer[i]; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        const n=outer[(i+1)%outer.length]; a += x*n[1]-n[0]*y; }
      const area = Math.abs(a/2) * Math.cos(((minY+maxY)/2)*Math.PI/180);
      return { rings, bbox:[minX,minY,maxX,maxY], area };
    });
    GEO[f.properties.c] = { feature: f, polys, area: polys.reduce((s,p)=>s+p.area,0) };
  }
  for (const [code, c] of Object.entries(COUNTRIES)){
    if (!GEO[code]) continue;
    const names = new Set([c.nl, c.en, ...c.alias]);
    SEARCH.push({ code, keys: [...names].map(norm).filter(Boolean) });
  }
  overlay(null);
}

/* ================= GEOMETRY ================= */
function inRing(x, y, ring){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
const inPoly = (x,y,p) => inRing(x,y,p.rings[0]) && !p.rings.slice(1).some(h=>inRing(x,y,h));
function countryAt(lat, lng){
  for (const [code, g] of Object.entries(GEO)) for (const p of g.polys){
    const [a,b,c,d]=p.bbox; if (lng>=a&&lng<=c&&lat>=b&&lat<=d && inPoly(lng,lat,p)) return code;
  }
  return null;
}
function pickWeighted(items, w){ let s=items.reduce((a,i)=>a+w(i),0), r=Math.random()*s; for(const i of items){ r-=w(i); if(r<=0) return i; } return items[items.length-1]; }
function randomLocation(settings, used){
  let pool = Object.keys(GEO).filter(c => COUNTRIES[c] && !used.includes(c)
    && (settings.continent==='ALL' || COUNTRIES[c].cont===settings.continent)
    && (settings.small || !COUNTRIES[c].small));
  if (!pool.length) pool = Object.keys(GEO).filter(c => settings.continent==='ALL' || COUNTRIES[c].cont===settings.continent);
  for (let attempt=0; attempt<30; attempt++){
    const code = settings.weighting==='area' ? pickWeighted(pool, c=>GEO[c].area) : rnd(pool);
    const poly = pickWeighted(GEO[code].polys, p=>p.area);
    const [a,b,c,d] = poly.bbox;
    for (let i=0;i<200;i++){
      const lng = a + Math.random()*(c-a), lat = b + Math.random()*(d-b);
      if (inPoly(lng, lat, poly)) return { code, lat:+lat.toFixed(4), lng:+lng.toFixed(4) };
    }
    pool = pool.filter(x=>x!==code);
  }
  return null;
}

/* ================= HINTS ================= */
// r = rang (laag = vaag), g = groep (aan/uit in lobby), f = familie (max 1 per ronde in het midden)
const HINT_DEFS = [
  { k:'cont',     r:0, g:'geo',    f:'cont',   ok:c=>true },
  { k:'hemi',     r:1, g:'geo',    f:'hemi',   ok:c=>true },
  { k:'climate',  r:1, g:'geo',    f:'climate',ok:c=>true },
  { k:'drive',    r:1, g:'geo',    f:'drive',  ok:c=>true },
  { k:'coast',    r:2, g:'geo',    f:'coast',  ok:c=>true },
  { k:'size',     r:2, g:'geo',    f:'size',   ok:c=>c.area>0 },
  { k:'sub',      r:2, g:'geo',    f:'sub',    ok:c=>!!c.sub },
  { k:'pop',      r:2, g:'people', f:'pop',    ok:c=>true },
  { k:'lang',     r:3, g:'people', f:'lang',   ok:c=>c.lang.length>0 },
  { k:'curshare', r:3, g:'money',  f:'cur',    ok:(c,code)=>!!(CODES[code]&&CODES[code][0]) },
  { k:'cursym',   r:3, g:'money',  f:'cur',    ok:(c,code)=>!!(CODES[code]&&CODES[code][0]) },
  { k:'tel',      r:4, g:'codes',  f:'tel',    ok:c=>!!c.tel && c.tel.length>2 },
  { k:'cur',      r:4, g:'money',  f:'cur',    ok:(c,code)=>!!(CODES[code]&&CODES[code][0]) },
  { k:'tld',      r:4, g:'codes',  f:'tld',    ok:c=>!!c.tld },
  { k:'nb1',      r:4, g:'nb',     f:'nb',     ok:c=>c.nb.length>0 },
  { k:'nb',       r:5, g:'nb',     f:'nb',     ok:c=>c.nb.length>0 },
  { k:'namelen',  r:5, g:'name',   f:'name',   ok:c=>true },
  { k:'cap',      r:6, g:'name',   f:'cap',    ok:c=>!!c.cap, late:true },
  { k:'flag',     r:6, g:'name',   f:'flag',   ok:c=>true, late:true },
  { k:'name',     r:7, g:'name',   f:'name',   ok:c=>true, late:true },
];
function chooseHints(code, count, groups){
  const c = COUNTRIES[code];
  const on = (groups && groups.length) ? groups : HINT_GROUPS;
  let avail = HINT_DEFS.filter(h => h.ok(c, code) && on.includes(h.g));
  if (!avail.length) avail = HINT_DEFS.filter(h => h.ok(c, code));
  const first = avail.find(h=>h.k==='cont') || avail.slice().sort((a,b)=>a.r-b.r)[0];
  const lates = avail.filter(h=>h.late && h!==first);
  const last = lates.length ? rnd(lates) : avail.filter(h=>h!==first).sort((a,b)=>b.r-a.r)[0];
  const used = new Set([first && first.f, last && last.f]);
  const middle = [];
  for (const h of shuffle(avail.filter(h => h!==first && h!==last && !h.late))){
    if (middle.length >= Math.max(0, count-2)) break;
    if (used.has(h.f)) continue;
    used.add(h.f); middle.push(h);
  }
  middle.sort((a,b)=>a.r-b.r);
  return [...new Set([first, ...middle, last].filter(Boolean))].slice(0, count).map(h=>h.k);
}
// Host: ruwe, taalneutrale waarde. Client: tekst in eigen taal.
function hintValue(k, code, loc){
  const c = COUNTRIES[code];
  const nm = l => { const n = c[l] || c.en; return { l: n[0], n: n.replace(/[^\p{L}]/gu,'').length }; };
  const lat = loc ? loc.lat : 0, lng = loc ? loc.lng : 0;
  switch(k){
    case 'cont': return c.cont; case 'sub': return c.sub; case 'drive': return c.drive;
    case 'coast': return { land: c.land, nb: c.nb.length }; case 'pop': return c.pop;
    case 'lang': return c.lang; case 'tel': return c.tel; case 'tld': return c.tld;
    case 'cur': case 'cursym': return CODES[code];
    case 'curshare': return { n: Math.max(0, (CURCOUNT[CODES[code][0]]||1) - 1) };
    case 'nb': return c.nb; case 'nb1': return rnd(c.nb);
    case 'cap': return c.cap[0]; case 'name': return { nl: nm('nl'), en: nm('en') };
    case 'namelen': return { nl: nm('nl').n, en: nm('en').n };
    case 'flag': return code;
    case 'hemi': return { ns: lat>=0?'N':'S', ew: lng>=0?'E':'W' };
    case 'climate': { const a = Math.abs(lat); return a<23.5?0 : a<35?1 : a<55?2 : a<66?3 : 4; }
    case 'size': { const a = c.area; return a<1e4?0 : a<1e5?1 : a<5e5?2 : a<2e6?3 : 4; }
  }
}
function renderHintValue(k, v){
  switch(k){
    case 'cont': return t(v);
    case 'sub': return lang==='nl' ? (SUB_NL[v]||v) : v;
    case 'drive': return t(v==='L'?'left':'right');
    case 'coast': return (v.land ? t('landlocked') : t('coast')) + ', ' + (v.nb ? t('nbCount',{n:v.nb}) : t('island'));
    case 'pop': return t('pop'+v);
    case 'lang': return v.map(l => lang==='nl' ? (LANG_NL[l]||l) : l).join(', ');
    case 'cursym': return v.map(cc => { const s = curSym(cc); return s===cc ? cc : s; }).join('  ·  ');
    case 'cur': return v.map(cc => { const n = curName(cc); return n === cc ? (cc==='ZWG' ? 'Zimbabwe Gold (ZWG)' : cc) : n + ' (' + cc + ')'; }).join(', ');
    case 'curshare': return v.n ? t('curShared',{n:v.n}) : t('curOnly');
    case 'tel': case 'tld': return v;
    case 'nb': return v.map(cname).join(', ');
    case 'nb1': return t('borders',{c:cname(v)});
    case 'cap': return t('capLetter', { l: v });
    case 'name': { const x = v[lang] || v.en; return t('nameLetter', { l: x.l, n: x.n }); }
    case 'namelen': return t('nameLen', { n: v[lang] || v.en });
    case 'flag': return flagImg(v, 160);
    case 'hemi': return t(v.ns==='N'?'hN':'hS') + ', ' + t(v.ew==='E'?'hE':'hW');
    case 'climate': return t('cl'+v);
    case 'size': return t('s'+v);
  }
  return '';
}

/* ================= STATE ================= */
const me = {
  id: localStorage.getItem('lr_pid') || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),
  name: localStorage.getItem('lr_name') || '',
  color: localStorage.getItem('lr_color') || rnd(COLORS),
};
localStorage.setItem('lr_pid', me.id);

const DEFAULT_SETTINGS = { rounds:5, roundTime:60, hintEvery:10, hintCount:6, hintGroups:[...HINT_GROUPS], difficulty:'normal', continent:'ALL', weighting:'uniform', small:false };
let room = null, roomCode = null, isHost = false, solo = false;
let S = null;               // laatste publieke snapshot (iedereen)
let H = null;               // host-only private state
let recvAt = 0, latency = 0;
let myAnswer = null;        // { roundId, code, hintsSeen, frac }
let sendMsg = null, joinTimer = null, hostWatch = null;

/* ================= NETWORK ================= */
function connect(code){
  roomCode = code;
  room = joinRoom({ appId: CONFIG.appId, turnConfig: CONFIG.turn.length ? CONFIG.turn : undefined }, 'LR-' + code);
  const action = room.makeAction('m');
  sendMsg = (msg, target) => action.send(msg, target ? { target } : undefined).catch(()=>{});
  action.onMessage = (msg, ctx) => onNet(msg, ctx.peerId);
  room.onPeerJoin = peerId => {
    if (isHost) return; // host wacht op hello
    sendMsg({ t:'hello', p: helloPayload() }, peerId);
  };
  room.onPeerLeave = peerId => onPeerLeave(peerId);
  location.hash = 'room=' + code;
}
const helloPayload = () => ({ id: me.id, name: me.name, color: me.color });
async function disconnect(){
  clearTimeout(joinTimer); clearInterval(hostWatch);
  if (H) { clearInterval(H.loop); clearTimeout(H.autoNext); }
  if (room) { try { await room.leave(); } catch(e){} }
  room = null; sendMsg = null; isHost = false; solo = false; S = null; H = null; myAnswer = null; roomCode = null;
  history.replaceState(null, '', location.pathname + location.search);
}

// Actie van mezelf: host verwerkt lokaal, peer stuurt naar host.
function act(msg){
  if (isHost) hostHandle(msg, selfId);
  else if (S && sendMsg) sendMsg(msg, S.hostPeer);
}
// Host stuurt snapshot naar iedereen en verwerkt hem zelf.
function broadcast(){
  if (H) H.lastBeat = now();
  const snap = publicState();
  if (sendMsg) sendMsg({ t:'state', p: snap });
  onState(snap);
}

function onNet(msg, peerId){
  if (!msg || typeof msg !== 'object') return;
  if (isHost) return hostHandle(msg, peerId);
  switch (msg.t){
    case 'state':
      if (msg.p.hostPeer !== peerId) return;  // alleen de host is bron van waarheid
      clearTimeout(joinTimer); overlay(null); lastHostMsg = now();
      onState(msg.p); break;
    case 'reject': clearTimeout(joinTimer); overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t(msg.p); }); break;
    case 'kick': overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t('kicked'); }); break;
  }
}

// Watchdog: geen state van host voor 9s = host weg
let lastHostMsg = 0;
setInterval(() => {
  if (!room || isHost || !S || solo) return;
  if (now() - lastHostMsg > 9000 && !$('#ovLoad').classList.contains('on')) electHost(S.hostPeer);
}, 1000);
function onPeerLeave(peerId){
  if (isHost) {
    const p = H && H.players.find(p=>p.peerId===peerId);
    if (p) { p.connected = false; p.leftAt = Date.now(); checkAllAnswered(); broadcast(); }
    return;
  }
  if (S && peerId === S.hostPeer) electHost(peerId);
}

// Host migratie: verbonden speler met laagste joinIdx wordt host.
function electHost(oldHostPeer){
  if (isHost || !S || S.hostPeer !== oldHostPeer) return;
  lastHostMsg = now();
  const peers = room ? Object.keys(room.getPeers()) : [];
  const alive = S.players.filter(p => p.peerId !== oldHostPeer && (p.peerId === selfId || peers.includes(p.peerId)) && p.connected);
  alive.sort((a,b)=>a.joinIdx-b.joinIdx);
  const next = alive[0];
  if (!next) return;
  toast(t('hostLeft'));
  if (next.peerId === selfId) becomeHost(oldHostPeer);
  else {
    S.hostPeer = next.peerId;
    // stuur eigen antwoord opnieuw zodat de nieuwe host het kent
    setTimeout(()=>{ if (myAnswer && S.round && myAnswer.roundId===S.round.id) sendMsg({ t:'answer', p:{...myAnswer, resend:true} }, S.hostPeer); }, 1500);
  }
}
function becomeHost(oldHostPeer){
  isHost = true;
  const snap = S;
  H = {
    players: snap.players.map(p => ({ ...p, connected: p.peerId===oldHostPeer ? false : p.connected, leftAt: p.peerId===oldHostPeer ? Date.now() : null })),
    settings: snap.settings, phase: snap.phase, roundN: snap.roundN, used: snap.used || [], history: snap.history || [],
    nextJoin: Math.max(...snap.players.map(p=>p.joinIdx)) + 1, result: snap.result, final: snap.final, round: null, blocked: [],
  };
  if (snap.phase === 'round' && snap.round){
    const r = snap.round;
    const code = countryAt(r.lat, r.lng);
    const elapsed = r.durationMs - Math.max(0, r.remainingMs - (now()-recvAt));
    H.round = { ...r, code, hintKeys: [...r.hints.map(h=>h.k), ...chooseHints(code, CONFIG.hintsPerRound, snap.settings.hintGroups).filter(k=>!r.hints.some(h=>h.k===k))].slice(0, r.hintTotal),
      startAt: now() - elapsed, answers: {}, order: 0, forced: r.hints.length, wants: {} };
    if (myAnswer && myAnswer.roundId === r.id) H.round.answers[me.id] = { ...myAnswer, at: now(), order: H.round.order++ };
  }
  toast(t('youHost'));
  startHostLoop();
  if (H.phase === 'result') scheduleAutoNext();
  broadcast();
}

/* ================= HOST LOGIC ================= */
function hostInit(){
  isHost = true;
  H = { players: [], settings: { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('lr_settings')||'{}') }, phase:'lobby', roundN:0, used:[], history:[], nextJoin:0, round:null, result:null, final:null, blocked:[] };
  hostAddPlayer({ ...helloPayload() }, selfId);
  startHostLoop();
  broadcast();
}
function hostAddPlayer(p, peerId){
  let pl = H.players.find(x => x.id === p.id);
  if (pl) { pl.peerId = peerId; pl.connected = true; pl.leftAt = null; pl.name = String(p.name).slice(0,16); pl.color = p.color; return true; }
  if (H.blocked.includes(p.id)) return 'kicked';
  if (H.phase !== 'lobby') return 'started';
  if (H.players.filter(x=>x.connected || (Date.now()-x.leftAt) < CONFIG.reserveMs).length >= CONFIG.maxPlayers) return 'full';
  H.players.push({ id: p.id, peerId, name: String(p.name||'?').slice(0,16), color: COLORS.includes(p.color)?p.color:COLORS[0], joinIdx: H.nextJoin++, score:0, connected:true, leftAt:null, correct:0, best:0, fastest:null });
  return true;
}
function hostHandle(msg, peerId){
  const p = msg.p || {};
  const player = H.players.find(x => x.peerId === peerId);
  switch (msg.t){
    case 'hello': {
      const res = hostAddPlayer(p, peerId);
      if (res !== true) { sendMsg && sendMsg({ t: res==='kicked'?'kick':'reject', p: res }, peerId); return; }
      broadcast(); beep(880,.06); break;
    }
    case 'sync': broadcast(); break;
    case 'settings':
      if (peerId !== selfId || H.phase !== 'lobby') return;
      if (Array.isArray(p.hintGroups)){ p.hintGroups = p.hintGroups.filter(g=>HINT_GROUPS.includes(g)); if (!p.hintGroups.length) return; }
      H.settings = { ...H.settings, ...p }; localStorage.setItem('lr_settings', JSON.stringify(H.settings)); broadcast(); break;
    case 'wanthint': {
      if (!player || H.phase !== 'round' || !H.round) return;
      const r = H.round; if (r.hints.length >= r.hintKeys.length) return;
      r.wants[player.id] = true;
      const cp = connectedPlayers();
      if (cp.length && cp.every(x => r.wants[x.id])) { r.forced = r.hints.length + 1; releaseHints(); }
      broadcast(); break;
    }
    case 'start':
      if (peerId !== selfId) return;
      if (H.phase === 'lobby' || H.phase === 'result') nextRound(); break;
    case 'kick': {
      if (peerId !== selfId) return;
      const target = H.players.find(x=>x.id===p.id); if (!target || target.peerId===selfId) return;
      H.blocked.push(target.id); H.players = H.players.filter(x=>x!==target);
      sendMsg && sendMsg({ t:'kick' }, target.peerId); broadcast(); break;
    }
    case 'answer': {
      if (!player || H.phase !== 'round' || !H.round || p.roundId !== H.round.id) return;
      if (H.round.answers[player.id]) return;  // eerste telt
      if (!COUNTRIES[p.code]) return;
      const el = now() - H.round.startAt;
      let hintsSeen = H.round.hints.length, frac = Math.max(0, 1 - el / H.round.durationMs);
      if (p.resend) { hintsSeen = Math.max(1, Math.min(hintsSeen, +p.hintsSeen||hintsSeen)); frac = Math.min(1, Math.max(0, +p.frac||0)); }
      H.round.answers[player.id] = { code: p.code, hintsSeen, frac, ms: Math.round(H.round.durationMs*(1-frac)), order: H.round.order++ };
      if (!checkAllAnswered()) broadcast();
      break;
    }
    case 'rematch':
      if (peerId !== selfId) return;
      H.phase = 'lobby'; H.roundN = 0; H.used = []; H.history = []; H.result = null; H.final = null; H.round = null;
      H.players = H.players.filter(x=>x.connected);
      H.players.forEach(x=>Object.assign(x,{score:0,correct:0,best:0,fastest:null}));
      broadcast(); break;
  }
}
function nextRound(){
  clearTimeout(H.autoNext);
  if (H.roundN >= H.settings.rounds) return finish();
  const loc = randomLocation(H.settings, H.used);
  if (!loc) return finish();
  H.used.push(loc.code); H.roundN++;
  const durationMs = H.settings.roundTime*1000, hintIntervalMs = H.settings.hintEvery*1000;
  const wanted = Math.min(CONFIG.hintsPerRound, H.settings.hintCount || 6, Math.max(2, Math.ceil(durationMs / hintIntervalMs)));
  const hintKeys = chooseHints(loc.code, wanted, H.settings.hintGroups), hintTotal = hintKeys.length;
  H.round = { id: Math.random().toString(36).slice(2,9), n: H.roundN, lat: loc.lat, lng: loc.lng, code: loc.code,
    zoom: CONFIG.zoom[H.settings.difficulty], pan: CONFIG.pan[H.settings.difficulty], difficulty: H.settings.difficulty,
    durationMs, hintIntervalMs, hintTotal, hintKeys, hints: [], startAt: now(), answers: {}, order: 0, forced: 0, wants: {} };
  H.phase = 'round'; H.result = null;
  releaseHints(); broadcast();
}
function releaseHints(){
  const r = H.round, el = now() - r.startAt;
  let changed = false;
  while (r.hints.length < r.hintKeys.length && (el >= r.hints.length * r.hintIntervalMs || r.hints.length < r.forced)){
    { const k = r.hintKeys[r.hints.length]; r.hints.push({ k, v: hintValue(k, r.code, r) }); } changed = true;
  }
  if (changed) r.wants = {};
  return changed;
}
function connectedPlayers(){
  const peers = room ? Object.keys(room.getPeers()) : [];
  return H.players.filter(p => p.peerId === selfId || (p.connected && peers.includes(p.peerId)));
}
function checkAllAnswered(){
  if (H.phase !== 'round' || !H.round) return false;
  const cp = connectedPlayers();
  if (cp.length && cp.every(p => H.round.answers[p.id])) { endRound(); return true; }
  return false;
}
function startHostLoop(){
  clearInterval(H.loop);
  H.loop = setInterval(() => {
    // reserveringen opruimen in lobby
    if (H.phase === 'lobby'){
      const before = H.players.length;
      H.players = H.players.filter(p => p.connected || Date.now()-p.leftAt < CONFIG.reserveMs);
      if (H.players.length !== before) broadcast();
    }
    if (now() - (H.lastBeat||0) > 3000) { H.lastBeat = now(); broadcast(); return; }
    if (H.phase !== 'round' || !H.round) return;
    if (releaseHints()) broadcast();
    if (now() - H.round.startAt >= H.round.durationMs) endRound();
  }, 200);
}
function scoreFor(ans, code, totalHints){
  const S_ = CONFIG.score;
  if (!ans) return { pts:0, kind:'none' };
  if (ans.code === code){
    const extra = Math.max(0, ans.hintsSeen - 1);
    const raw = (S_.correct - S_.perHint*extra) * (S_.timeBase + S_.timeWeight*ans.frac);
    return { pts: Math.round(Math.max(S_.min, raw)), kind:'good' };
  }
  if (COUNTRIES[ans.code] && COUNTRIES[ans.code].cont === COUNTRIES[code].cont) return { pts: S_.continent, kind:'half' };
  return { pts:0, kind:'miss' };
}
function endRound(){
  const r = H.round; if (!r || H.phase !== 'round') return;
  const rows = H.players.map(p => {
    const a = r.answers[p.id], s = scoreFor(a, r.code, r.hints.length);
    p.score += s.pts;
    if (s.kind==='good'){ p.correct++; if (p.fastest==null || a.ms < p.fastest) p.fastest = a.ms; }
    if (s.pts > p.best) p.best = s.pts;
    return { id:p.id, guess: a ? a.code : null, ms: a ? a.ms : null, hints: a ? a.hintsSeen : null, pts: s.pts, kind: s.kind, total: p.score, order: a ? a.order : 99 };
  }).sort((a,b)=> b.pts-a.pts || a.order-b.order);
  H.result = { roundId: r.id, n: r.n, code: r.code, lat: r.lat, lng: r.lng, rows, last: H.roundN >= H.settings.rounds, nextAt: CONFIG.resultAutoMs };
  H.history.push({ n:r.n, code:r.code });
  H.phase = 'result'; H.round = null;
  scheduleAutoNext(); broadcast();
}
function scheduleAutoNext(){
  clearTimeout(H.autoNext);
  H.resultStart = now();
  if (H.result && !H.result.last) H.autoNext = setTimeout(()=>{ if (H.phase==='result') nextRound(); }, CONFIG.resultAutoMs);
}
function finish(){
  clearTimeout(H.autoNext);
  H.phase = 'final';
  H.final = { ranking: H.players.slice().sort((a,b)=>b.score-a.score).map(p=>({ id:p.id, score:p.score, correct:p.correct, best:p.best, fastest:p.fastest })) };
  broadcast();
}
function publicState(){
  const r = H.round;
  return {
    hostPeer: selfId, phase: H.phase, settings: H.settings, roundN: H.roundN, used: H.used, history: H.history,
    players: H.players.map(({id,peerId,name,color,joinIdx,score,connected,correct,best,fastest}) => ({id,peerId,name,color,joinIdx,score,connected,correct,best,fastest})),
    round: r ? { id:r.id, n:r.n, lat:r.lat, lng:r.lng, zoom:r.zoom, pan:r.pan, difficulty:r.difficulty, durationMs:r.durationMs, hintIntervalMs:r.hintIntervalMs, hintTotal:r.hintTotal,
      hints: r.hints, remainingMs: Math.max(0, r.durationMs - (now()-r.startAt)), answered: Object.keys(r.answers), wants: Object.keys(r.wants||{}) } : null,

function ensureMap(){
  if (map) return map;
  map = L.map('map', { zoomControl:false, attributionControl:true, worldCopyJump:true });
  addTiles(map);
  return map;
}
function addTiles(m){
  m.attributionControl.setPrefix(false);
  let failed = 0, usingFallback = false;
  const main = L.tileLayer(CONFIG.tiles.main.url, { attribution: CONFIG.tiles.main.attr, maxZoom: CONFIG.tiles.main.maxZoom, crossOrigin: true });
  main.on('tileerror', () => {
    if (usingFallback || ++failed < 4) return;
    usingFallback = true; m.removeLayer(main);
    L.tileLayer(CONFIG.tiles.fallback.url, { attribution: CONFIG.tiles.fallback.attr, maxZoom: CONFIG.tiles.fallback.maxZoom, subdomains:'abcd' }).addTo(m);
  });
  main.addTo(m);
}
function renderGame(){
  show('game');

  if (renderedRound !== r.id){
    renderedRound = r.id;

    m.invalidateSize();
    const lock = r.pan === 0;
    m.setMinZoom(0); m.setMaxZoom(18); m.setMaxBounds(null);
    m.setView([r.lat, r.lng], r.zoom, { animate:false });
    if (lock){ m.dragging.disable(); m.touchZoom.disable(); m.doubleClickZoom.disable(); m.scrollWheelZoom.disable(); m.boxZoom.disable(); m.keyboard.disable(); }
    else {
      m.dragging.enable(); m.touchZoom.enable(); m.doubleClickZoom.enable(); m.scrollWheelZoom.enable(); m.keyboard.enable();
      m.setMinZoom(r.zoom - 1); m.setMaxZoom(r.zoom + 2);

  }).join('');

// Client kent het land niet: host stuurt per hint een taalneutrale waarde mee.
function hintTextFromKey(k){
  const h = S.round.hints.find(x=>x.k===k);
  return h && h.v != null ? renderHintValue(k, h.v) : '';
}

/* ================= TIMER LOOP (lokaal) ================= */
function tick(){
  requestAnimationFrame(tick);
  if (!S) return;
  if (S.phase === 'round' && S.round){
    const r = S.round;
    const rem = r.remainingMs - (now() - recvAt) - latency;
    const tc = $('#timerChip'); tc.textContent = fmtTime(rem); tc.parentElement.classList.toggle('low', rem < 10000);
    $('#timerBar').style.transform = `scaleX(${Math.max(0, Math.min(1, rem / r.durationMs))})`;
    const elapsed = r.durationMs - rem;
    const nextIdx = r.hints.length;
    if (nextIdx < r.hintTotal){
      const into = elapsed - (nextIdx-1)*r.hintIntervalMs;
      $('#hintBar').style.width = Math.min(100, Math.max(0, into / r.hintIntervalMs * 100)) + '%';
      $('#nextSecs').textContent = Math.max(0, Math.ceil((nextIdx*r.hintIntervalMs - elapsed)/1000)) + 's';
      $('#nextHint').style.display = '';
    } else $('#nextHint').style.display = 'none';
  }
  if (S.phase === 'result' && S.result){
    const left = S.result.nextAt - (now()-recvAt);
    $('#resTimer').textContent = S.result.last ? '' : t('nextIn', { s: Math.max(0, Math.ceil(left/1000)) });
    $('#resTimer').style.display = S.result.last ? 'none' : '';
  }
}
requestAnimationFrame(tick);

/* latency meten naar host */
setInterval(async () => {
  const d = $('#netDot');
  if (!room || isHost || !S) { d.className = 'netdot'; return; }
  try { const ms = await Promise.race([room.ping(S.hostPeer), new Promise((_,rej)=>setTimeout(()=>rej(),3000))]); latency = ms/2; d.className = 'netdot' + (ms>400?' mid':''); }
  catch(e){ d.className = 'netdot bad'; }
}, 4000);

let acItems = [], acSel = 0;
function search(q){
  const n = norm(q); if (!n) return [];
  const res = [];
  for (const s of SEARCH){
    let best = 99;
    for (const k of s.keys){ const i = k.indexOf(n); if (i===0) best = Math.min(best, 0); else if (i>0) best = Math.min(best, 1); }
    if (best < 99) res.push({ code:s.code, score: best + cname(s.code).length/100 });
  }
  return res.sort((a,b)=>a.score-b.score).slice(0,6).map(r=>r.code);
}
function closeAc(){ $('#ac').classList.remove('on'); acItems = []; }
function renderAc(){
  const ac = $('#ac');
  if (!acItems.length){ ac.classList.remove('on'); return; }
  const q = norm($('#guess').value);
  const hl = name => { const n = esc(name); const i = norm(name).indexOf(q); if (i !== 0 || !q) return n; let seen = 0, end = 0; for (let j=0;j<name.length && seen<q.length;j++){ if (norm(name[j])) seen++; end = j+1; } return `<mark>${esc(name.slice(0,end))}</mark>${esc(name.slice(end))}`; };
  ac.innerHTML = acItems.map((c,i)=>`<div class="${i===acSel?'sel':''}" data-code="${c}">${flagImg(c,40)}<span>${hl(cname(c))}</span></div>`).join('');
  ac.classList.add('on');
}
$('#guess').addEventListener('input', e => { acItems = search(e.target.value); acSel = 0; renderAc(); });
$('#guess').addEventListener('keydown', e => {
  if (e.key==='ArrowDown'){ acSel = Math.min(acSel+1, acItems.length-1); renderAc(); e.preventDefault(); }
  else if (e.key==='ArrowUp'){ acSel = Math.max(acSel-1, 0); renderAc(); e.preventDefault(); }
  else if (e.key==='Enter'){ e.preventDefault(); submitGuess(acItems[acSel]); }
  else if (e.key==='Escape') closeAc();
});
$('#ac').addEventListener('pointerdown', e => { const d = e.target.closest('[data-code]'); if (d){ e.preventDefault(); submitGuess(d.dataset.code); } });
$('#guessBtn').addEventListener('click', () => submitGuess(acItems[acSel]));
function submitGuess(code){
  if (!S || S.phase!=='round' || !S.round) return;
  if (!code){ const exact = SEARCH.find(s => s.keys.includes(norm($('#guess').value))); code = exact && exact.code; }
  if (!code){ toast(t('unknown')); return; }
  const r = S.round, rem = r.remainingMs - (now()-recvAt) - latency;
  myAnswer = { roundId: r.id, code, hintsSeen: r.hints.length, frac: Math.max(0, rem / r.durationMs) };
  closeAc(); $('#guess').blur(); beep(990,.08);
  act({ t:'answer', p: myAnswer });
  if (S.phase === 'round' && S.round) renderGame();
}

  $('#resBody').innerHTML = R.rows.map((row, i) => {

    return `<tr style="${firstPaint ? 'animation-delay:'+(i*90)+'ms' : 'animation:none'}"><td><span class="row" style="gap:6px">${dotHtml(p)}<span>${esc(p.name)}</span></span></td><td>${g}</td><td class="n">${row.ms!=null?(row.ms/1000).toFixed(1)+'s':''}</td><td class="n plus ${row.kind}" data-count="${row.pts}">+${row.pts}</td><td class="n">${row.total}</td></tr>`;

    (function step(n){ const k = Math.min(1, (n - t0)/dur); el.textContent = '+' + Math.round(to * (1 - Math.pow(1-k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);

function drawResultMap(R){
  if (!$('#result').classList.contains('on')) return;
  if (!rmap){ rmap = L.map('rmap', { zoomControl:false, attributionControl:true }); addTiles(rmap); }
  rmap.invalidateSize();
  rmap.eachLayer(l => { if (!(l instanceof L.TileLayer)) rmap.removeLayer(l); });
  const g = GEO[R.code];
  // eerst view zetten (Leaflet heeft een view nodig voor vectorlagen)
  const poly = g.polys.find(p => inPoly(R.lng, R.lat, p)) || g.polys.reduce((a,b)=>a.area>b.area?a:b);
  const [a,b,c,d] = poly.bbox;
  rmap.fitBounds([[b,a],[d,c]], { padding:[20,20], maxZoom:7, animate:false });
  L.geoJSON(g.feature, { style: { color:'#fbf8f1', weight:2.5, fillColor:'#c2432b', fillOpacity:.28 } }).addTo(rmap);
  L.circleMarker([R.lat, R.lng], { radius:8, color:'#fbf8f1', weight:3, fillColor:'#c2432b', fillOpacity:1 }).addTo(rmap);
}

  const best = F.ranking.reduce((a,b)=>b.best>a.best?b:a, F.ranking[0]);

(async function boot(){
  $('#name').value = me.name; renderColors(); applyI18n(); show('start');
  try { await loadData(); } catch(e){ overlay('Data laden mislukt. Draai via een webserver (zie README).'); return; }
  const m = location.hash.match(/room=([A-Z0-9]{4})/i);
  if (m){ $('#codeIn').value = m[1].toUpperCase(); if (me.name) joinAsPeer(m[1].toUpperCase()); }
})();

/* expose voor tests */
window.__lr = { get S(){return S}, get H(){return H}, countryAt, randomLocation, scoreFor, search, chooseHints, hintValue, renderHintValue, HINT_DEFS, COUNTRIES: () => COUNTRIES };
