  if (needName()) return;
  solo = true; hostInit();
});
$('#joinBtn').addEventListener('click', () => {
  if (needName()) return;
  const code = $('#codeIn').value.trim().toUpperCase();
  if (code.length !== 4){ $('#startErr').textContent = t('codeNeeded'); return; }
  joinAsPeer(code);
});
async function joinAsPeer(code){
  if (!(await netOk())) return;
  connect(code);
  overlay(t('searching', { c: code }), t('searchingSub'), true);
  joinTimer = setTimeout(() => { overlay(null); disconnect().then(()=>{ show('start'); $('#startErr').textContent = t('notFound'); }); }, CONFIG.joinTimeoutMs);
}
$('#ovCancel').addEventListener('click', () => { overlay(null); disconnect().then(()=>show('start')); });
async function leave(){ await disconnect(); huntClear(); renderedRound = null; renderedResult = null; show('start'); }
$('#leaveBtn').addEventListener('click', leave);
$('#leaveBtn2').addEventListener('click', leave);
$('#copyBtn').addEventListener('click', async () => {
  const url = location.origin + location.pathname + '#room=' + roomCode;
  try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch(e){ prompt('', url); }
});
$('#shareBtn').addEventListener('click', async () => {
  const url = location.origin + location.pathname + '#room=' + roomCode;
  if (navigator.share) { try { await navigator.share({ title:'Geoflatter', text: roomCode, url }); } catch(e){} }
  else { try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch(e){} }
});
$('#lobbyPlayers').addEventListener('click', e => {
  const k = e.target.dataset.kick; if (k){ act({ t:'kick', p:{ id: k } }); return; }
  const b = e.target.closest('[data-op]'); if (!b || !isMeHost()) return;
  const target = S.players.find(p => p.id === b.dataset.op);
  if (target) act({ t:'op', p:{ id: target.id, op: !target.op } });
});
document.querySelectorAll('.seg[data-set]').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !canEdit()) return;
  const v = isNaN(b.dataset.val) ? b.dataset.val : +b.dataset.val;
  act({ t:'settings', p:{ [seg.dataset.set]: v } });
}));
document.querySelectorAll('.sw[data-sw]').forEach(sw => sw.addEventListener('click', () => { if (canEdit()) act({ t:'settings', p:{ [sw.dataset.sw]: !S.settings[sw.dataset.sw] } }); }));
$('#startBtn').addEventListener('click', () => act({ t:'start' }));
$('#nextBtn').addEventListener('click', () => act({ t:'start' }));
$('#rematchBtn').addEventListener('click', () => act({ t:'rematch' }));

// Telefoon terug uit vergrendeling: state opnieuw opvragen
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && room && !isHost && S) act({ t:'sync' }); });
window.addEventListener('resize', () => { map && map.invalidateSize(); rmap && rmap.invalidateSize(); dmap && dmap.invalidateSize(); });
// Telefoontoetsenbord: op iOS blijft het scherm even hoog, dus het paneel moet zelf boven het toetsenbord gaan staan.
let fullH = innerHeight;
function fitKeyboard(){
  const vv = window.visualViewport, typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  fullH = Math.max(fullH, innerHeight);
  const kb = vv && typing ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0;
  document.documentElement.style.setProperty('--kb', kb + 'px');
  document.body.classList.toggle('kb', typing && (kb > 80 || innerHeight < fullH*.75));
}
if (window.visualViewport){ visualViewport.addEventListener('resize', fitKeyboard); visualViewport.addEventListener('scroll', fitKeyboard); }
document.addEventListener('focusin', fitKeyboard);
document.addEventListener('focusout', () => { setTimeout(() => { fitKeyboard(); if (document.body.dataset.screen === 'game') scrollTo(0,0); }, 60); });
window.addEventListener('orientationchange', () => { fullH = innerHeight; });

/* ================= CHAT (peer to peer, geen regels) ================= */
let sendChat = null, chatLog = [], unread = 0;
function updateChat(){
  const on = !!room && !solo && document.body.dataset.screen && document.body.dataset.screen !== 'start';
  $('#chatBtn').classList.toggle('show', on); $('#emoBtn').classList.toggle('show', on); document.body.classList.toggle('chat-on', on);
  if (!on){ $('#chat').classList.remove('on'); closeEmoTray(); }
}
function renderChat(){
  const log = $('#chatLog'); if (!log) return;
  log.innerHTML = chatLog.length ? chatLog.map(m => `<div class="msg ${m.mine?'me':''}"><small>${m.mine?'':dotHtml({color:m.color})}${m.mine?'':esc(m.name)}</small>${m.emote ? `<p class="emoMsg"><span class="emo">${EMOTES[m.emote]}</span>${esc(t('em_'+m.emote))}</p>` : `<p>${esc(m.text)}</p>`}</div>`).join('') : `<div class="cempty">${t('chatEmpty')}</div>`;
  log.scrollTop = log.scrollHeight;
  const b = $('#chatBadge'); b.textContent = unread; b.classList.toggle('on', unread > 0);
}
function addChat(m){ chatLog.push(m); if (chatLog.length > 200) chatLog.shift(); if (!m.mine && !m.emote && !$('#chat').classList.contains('on')){ unread++; beep(880,.05); } renderChat(); }
function receiveChat(m, peerId){
  if (!m) return;
  const who = { name: String(m.name||'?').slice(0,16), color: okColor(m.color, '#888888'), avatar: avKey(m.avatar) };
  if (m.emote !== undefined){
    // Alleen bekende emotes, en per speler maximaal één per 0,7 s, zodat niemand het scherm kan volspammen.
    if (typeof m.emote !== 'string' || !Object.prototype.hasOwnProperty.call(EMOTES, m.emote)) return;
    const k = peerId || who.name, now = Date.now(); if (now - (emoSeen[k] || 0) < 700) return; emoSeen[k] = now;
    addChat({ ...who, emote: m.emote, mine:false }); showEmote(who, m.emote); return;
  }
  if (typeof m.text !== 'string' || !m.text.trim()) return;
  addChat({ ...who, text: m.text.slice(0,500), mine:false });
}
$('#chatBtn').addEventListener('click', () => { closeEmoTray(); $('#chat').classList.add('on'); unread = 0; renderChat(); $('#chatIn').focus(); });
$('#chatClose').addEventListener('click', () => $('#chat').classList.remove('on'));
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault(); const text = $('#chatIn').value.trim(); if (!text || !sendChat) return;
  $('#chatIn').value = ''; sendChat({ name: me.name, color: me.color, text });
  addChat({ name: me.name, color: me.color, text, mine:true });
});
$('#chatIn').addEventListener('keydown', e => e.stopPropagation());

/* ================= EMOTES =================
   Vijf kaartstickers (inline SVG, 64x64) in de vlakke tinten van het spel. De animaties staan in de CSS (.em-*)
   en lopen bij .play (popup) of hover (balk). Een element met een CSS animatie krijgt geen transform attribuut. */
const PIN = '<path class="em-acc" d="M32 41C26.5 34 22 28.5 22 19a10 10 0 0 1 20 0c0 9.5-4.5 15-10 22z"/><circle class="em-card" cx="32" cy="19" r="3.6"/>';
const STAR = 'M0-5Q.8-.8 5 0Q.8.8 0 5Q-.8.8-5 0Q-.8-.8 0-5Z';
const DISC = '<circle class="em-disc" cx="32" cy="32" r="30"/>';
const EMOTES = {
  // Raak: een pin landt midden in de roos
  hit: `<svg viewBox="0 0 64 64">${DISC}
    <g class="em-fb em-ring"><circle class="em-blue" cx="32" cy="41" r="17"/><circle class="em-card" cx="32" cy="41" r="11.5"/><circle class="em-gold" cx="32" cy="41" r="6"/></g>
    <g class="em-fb em-hitspark em-ln a" style="stroke-width:2.6"><path d="M17 33l-4.5-3M47 33l4.5-3M32 52v4"/></g>
    <g class="em-fb bot em-pin">${PIN}</g></svg>`,
  // Waar: een kompas dat niet weet waar het heen moet
  lost: `<svg viewBox="0 0 64 64">${DISC}
    <circle class="em-card" cx="31" cy="38" r="17" style="stroke:var(--delft);stroke-width:4"/>
    <path class="em-ln k" style="stroke-width:2" d="M31 24v3M31 49v3M17 38h3M42 38h3"/>
    <g class="em-fb em-needle"><path class="em-acc" d="M31 26l4.5 12h-9z"/><path class="em-blue" d="M31 50l-4.5-12h9z"/></g>
    <circle class="em-card" cx="31" cy="38" r="2.2" style="stroke:var(--ink);stroke-width:1.5"/>
    <g class="em-fb bot em-q"><path class="em-ln g" style="stroke-width:3.4" transform="translate(25 -2) scale(1.4)" d="M9.5 9.2a2.6 2.6 0 0 1 5 .8c0 1.8-2.5 2.2-2.5 4M12 17.5v.01"/></g></svg>`,
  // Schiet op: een zandloper die schudt terwijl het zand wegloopt
  hurry: `<svg viewBox="0 0 64 64">${DISC}
    <g class="em-ln k em-tick" style="stroke-width:2.4;opacity:.55"><path d="M11 25l-4-2M11 39l-4 2M53 25l4-2M53 39l4 2"/></g>
    <g class="em-fb em-shake"><path class="em-glass" d="M21 15H43C43 24 34.5 28 33.2 32C34.5 36 43 40 43 49H21C21 40 29.5 36 30.8 32C29.5 28 21 24 21 15Z"/>
    <g class="em-fb bot em-sandtop"><path class="em-gold" d="M25 17H39C38.5 22 35 25.5 32.8 29H31.2C29 25.5 25.5 22 25 17Z"/></g>
    <g class="em-fb bot em-sandbot"><path class="em-gold" d="M23 49C25 43 29 40.5 32 40.5S39 43 41 49Z"/></g>
    <path class="em-ln g em-stream" style="stroke-width:1.8" d="M32 29V41"/>
    <rect class="em-acc" x="16" y="10" width="32" height="5.5" rx="2.7"/><rect class="em-acc" x="16" y="48.5" width="32" height="5.5" rx="2.7"/></g></svg>`,
  // Plons: de pin valt in zee
  splash: `<svg viewBox="0 0 64 64">${DISC}
    <g class="em-fall"><g transform="translate(32 52) rotate(18) scale(.9) translate(-32 -41)">${PIN}</g></g>
    <path class="em-blue" d="M3.7 42q7.075-4 14.15 0t14.15 0t14.15 0t14.15 0A30 30 0 0 1 3.7 42Z"/>
    <path class="em-ln c" style="stroke-width:1.8;opacity:.4" d="M12 50q4-2.5 8 0t8 0M38 54q4-2.5 8 0t8 0"/>
    <ellipse class="em-ln c em-fb em-rip" style="stroke-width:1.8" cx="35" cy="43" rx="11" ry="3.2"/><ellipse class="em-ln c em-fb em-rip two" style="stroke-width:1.8" cx="35" cy="43" rx="11" ry="3.2"/>
    <circle class="em-sea em-fb em-drop" style="--dx:-14px;--dy:-18px" cx="35" cy="41" r="3.2"/><circle class="em-sea em-fb em-drop" style="--dx:-1px;--dy:-27px" cx="35" cy="41" r="2.6"/><circle class="em-sea em-fb em-drop" style="--dx:13px;--dy:-17px" cx="35" cy="41" r="3.2"/></svg>`,
  // Kaartkoning: een wereldbol met een kroon
  king: `<svg viewBox="0 0 64 64">${DISC}
    <g class="em-fb em-globe"><circle class="em-blue" cx="32" cy="41" r="16"/>
    <path class="em-ok" d="M22.5 36c2.5-2 6-1.5 7 1s-1 4-2.5 5.5-1 4.5-3.5 5.5c-2-1.5-3.5-4-3-7s-.5-3.5 2-5z"/>
    <path class="em-ok" d="M35 34.5c3-1.5 7.5-.5 8.5 3s-2 4-3.5 6-.5 5-3.5 6c-2-2.5-1.5-5.5-3-7.5s-2.5-4.5 1.5-7.5z"/>
    <path class="em-ln c" style="stroke-width:1.8;opacity:.4" d="M21 33a13 13 0 0 1 8-6"/></g>
    <g class="em-fb bot em-crown"><path class="em-gold" style="stroke:var(--gold);stroke-width:2;stroke-linejoin:round" d="M20.5 28L19 14l7 6 6-10 6 10 7-6-1.5 14z"/><rect class="em-acc" x="20.5" y="24.5" width="23" height="4.5" rx="1.2"/><circle class="em-card" cx="32" cy="19.5" r="2"/></g>
    <g transform="translate(51 22) scale(1.3)"><path class="em-gold em-fb em-star" d="${STAR}"/></g>
    <g transform="translate(13 27)"><path class="em-card em-fb em-star two" d="${STAR}"/></g>
    <g transform="translate(50 47) scale(.8)"><path class="em-gold em-fb em-star three" d="${STAR}"/></g></svg>`,
};
const EMO_SFX = { hit:[[660,0],[990,90]], lost:[[330,0],[294,120],[349,240]], hurry:[[880,0],[880,150],[880,300]], splash:[[220,0],[165,70]], king:[[523,0],[659,90],[784,180],[1047,270]] };
const EMO_COOLDOWN = 1500, emoSeen = {};
let emoLast = 0;
const emoOpen = () => $('#emoTray').classList.contains('on');
function closeEmoTray(){ $('#emoTray').classList.remove('on'); $('#emoBtn').classList.remove('on'); $('#emoBtn').setAttribute('aria-expanded', 'false'); }
function renderEmoBar(){
  const html = Object.keys(EMOTES).map(id => `<button class="emob" data-e="${id}" title="${esc(t('em_'+id))}" aria-label="${esc(t('em_'+id))}"><span class="emo">${EMOTES[id]}</span></button>`).join('');
  $('#emoTray').innerHTML = html; $('#emoStrip').innerHTML = html;
}
// Anderen zien de sticker met jouw naam en kleur. Zelf zie je hem in de chat en de knoppen rusten even.
function sendEmote(id){
  if (!sendChat || !Object.prototype.hasOwnProperty.call(EMOTES, id)) return;
  const now = Date.now(); if (now - emoLast < EMO_COOLDOWN) return; emoLast = now;
  sendChat({ name: me.name, color: me.color, avatar: me.avatar, emote: id });
  addChat({ name: me.name, color: me.color, emote: id, mine:true });
  closeEmoTray(); beep(740, .04);
  document.querySelectorAll('.emob').forEach(b => b.classList.add('cool'));
  setTimeout(() => document.querySelectorAll('.emob').forEach(b => b.classList.remove('cool')), EMO_COOLDOWN);
}
function showEmote(who, id){
  const layer = $('#emoLayer');
  while (layer.children.length >= 3) layer.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'emo-pop'; el.style.setProperty('--c', who.color);
  el.innerHTML = `<div class="emo play">${EMOTES[id]}</div><div class="emo-txt"><span class="emo-who">${avaHtml(who, 'xs')}<b>${esc(who.name)}</b></span><span class="emo-lbl">${esc(t('em_'+id))}</span></div>`;
  layer.appendChild(el);
  (EMO_SFX[id] || []).forEach(([f, d]) => setTimeout(() => beep(f, .09, id === 'splash' ? 'triangle' : 'sine', .07), d));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 3400);
}
$('#emoBtn').addEventListener('click', () => {
  const open = !emoOpen(); $('#chat').classList.remove('on');
  $('#emoTray').classList.toggle('on', open); $('#emoBtn').classList.toggle('on', open); $('#emoBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => { const b = e.target.closest('.emob'); if (b) sendEmote(b.dataset.e); });
document.addEventListener('pointerdown', e => { if (emoOpen() && !e.target.closest('#emoTray,#emoBtn')) closeEmoTray(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEmoTray(); });

/* ================= BOOT ================= */
(async function boot(){
  $('#name').value = me.name; renderColors(); applyI18n(); show('start');
  try { await loadData(); } catch(e){ overlay(t('dataFail')); return; }
  const m = location.hash.match(/room=([A-Z0-9]{4})/i);
  if (m){ $('#codeIn').value = m[1].toUpperCase(); if (me.name) joinAsPeer(m[1].toUpperCase()); }
})();
</script>
